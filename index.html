token costs, and creating sustainable operating models that balance automation, trust, and business value. The session will provide a forward-looking view of how AI and managed services will evolve together to create more efficient, resilient, and scalable enterprises.","speakers":[{"name":"Dr. Kanav Kahol","role":"Chief AI Officer","organization":"Kagen.ai"}]},{"id":"e4031590-f036-404f-925f-157987346765","date":"October 1, 2026","start":"12:30 PM PT","end":"12:55 PM PT","title":"Sovereign AI at Frontier Scale","track":"Lunch Breakout Session","room":"Theater 2","description":"Frontier AI development is increasingly concentrated among a small number of centralized labs, leaving many countries, industries, institutions, and communities dependent on models they cannot fully inspect, adapt, govern, or control. Project Tapestry, led by the AI Alliance, offers a different path: a global, open, consortium-based approach to developing frontier foundation models where partners contribute data, compute, and talent while retaining control of their own data and the ability to build sovereign derivatives aligned to local laws, languages, cultures, industries, and priorities.\n\nIn this session, attendees will learn how Project Tapestry re-frames sovereignty as a performance strategy, why open weights alone are not enough, and how collaborative model development can help organizations move from simply consuming AI to actively shaping the foundation models they depend on.","speakers":[{"name":"Anthony Annunziata","role":"Director of AI Open Innovation","organization":"IBM"}]},{"id":"fe06ff05-354e-42ac-9b62-a00eca41e690","date":"October 1, 2026","start":"12:30 PM PT","end":"12:55 PM PT","title":"Your Agents Are Already Running. Accounting for What They Did Isn't","track":"Lunch Breakout Session","room":"Theater 4","description":"Every organization I talk to knows their agents are running right now. Almost none can tell you which tickets those agents touched last quarter, or what any of it cost.\n\nThat gap doesn't stay small. Every day it goes unaddressed, more unattributed spend and unexplained output pile up behind it, and the system gets harder to audit after the fact than it would have been to design correctly from day one.\n\nThis talk makes the case for building attribution into agent architecture now, while it's still a design decision and not a forensic project. Drawing on what it actually takes to tie each agent commit and PR back to the specific ticket driving it, Shams Chauthani, CTO of Tempo, walks through where most attribution attempts break down, what a real accounting layer requires architecturally, and why the teams that solve this now will still be able to answer three questions at once: what did the agents cost last quarter, what work items did they close, and which ones touched the code that broke on Friday.\n\nYou'll leave with:\n\nWhere \"AI visibility\" tooling quietly becomes guesswork the moment more than one agent touches a task\n\nWhat it actually takes to tie agent commits and PRs to the ticket driving them, not just report on it after the fact\n\nThe specific instrumentation points where agent-to-ticket linkage has to be captured, and what breaks when you skip them","speakers":[{"name":"Shams Chauthani","role":"CTO","organization":"Tempo"}]},{"id":"490c499f-fa73-42b0-872c-81d7f9248a05","date":"October 1, 2026","start":"12:30 PM PT","end":"12:40 PM PT","title":"The Shared Layer above Your Coding Agents","track":"Lunch Lightning Talk","room":"Theater 3","description":"Developers now have many capable coding agents, but each lives inside its own harness, interfaces, sessions, and control model. Omnigent provides a shared layer across them. It lets developers compose work across existing agents, move between CLI, web, and mobile while preserving and sharing sessions, and apply contextual policies across agent activity. This talk introduces the meta-harness and explains how Omnigent turns a collection of separate agents into one coherent system.","speakers":[{"name":"Ankit Yadav","role":"Solutions Architect","organization":"Databricks"}]},{"id":"e46ed0eb-7a1b-44fb-8e46-ac17f0969cab","date":"October 1, 2026","start":"12:30 PM PT","end":"12:55 PM PT","title":"Performance Engineering in the Age of AI","track":"Lunch Mainstage Talk","room":"Theater 1","description":"Profiling has long been an esoteric skill that only few people ever took the time to learn. The tools are clunky, and the visualizations difficult to read. However, at it's core, performance engineering is very methodical, and follows a lot of rules. AI has also gotten very good at writting code, so in an abundance of luck, they are a match made in heaven!\n\nIn this session Frederic will walk through the incredible integration between AI and Profiling and show how performance engineering is now accessible to every engineer regardless of proficiency.","speakers":[{"name":"Frederic Branczyk","role":"Founder and CEO","organization":"Dash0"}]},{"id":"6ab92b7e-f711-43c3-9771-f82fdeec8b10","date":"October 1, 2026","start":"12:45 PM PT","end":"12:55 PM PT","title":"The Real Cost of Scaling AI: An Inference Playbook","track":"Lunch Lightning Talk","room":"Theater 3","description":"Training gets the headlines, but inference pays the bills, and for most AI products, it's where margins are won or lost. Today, the vast majority of inference runs on big cloud providers or abstraction platforms, where convenience is high but cost visibility is low. Teams that carefully optimize their models often ship them on infrastructure chosen by default, then discover at scale that their fastest-growing cost is also their least understood.\n\nThis session is a hands-on framework for understanding inference unit economics in practice. We'll start with the problem every team eventually faces: usage grows, the invoice grows faster, and nobody can quite explain the relationship between the two, because layers of managed abstraction hide the variables that drive cost.\n\nThe core of the talk is a step-by-step method for making those variables visible. We'll break down how to calculate your true cost per request (not just the sticker price), why utilization — not hardware price — is the number that matters most, and how workload shape (batch vs. real-time, bursty vs. steady, token-heavy vs. compute-light) should drive infrastructure choices. And we'll challenge a common assumption along the way: GPUs aren't the only answer. A growing share of production inference runs efficiently on CPU-only servers, and knowing when that trade-off wins is part of the framework.\n\nWith the model in hand, we'll map the decision landscape honestly: serverless APIs, managed GPU endpoints, dedicated GPU compute, and CPU-based inference each win in different scenarios, and attendees will get a simple break-even approach for knowing when to move between them.\n\nWe'll close with a brief look at how these principles play out on dedicated infrastructure: one example of how teams that own their inference stack turn cost from a mystery into a lever.\n\nAttendees will walk away with a clear AI infra framework, a checklist for auditing their current inference spend, and a clear-eyed way to answer the question every engineering lead eventually gets asked: \"why is our AI bill this high, and what are we doing about it?\"","speakers":[{"name":"Camila Maia","role":"Product Marketing Specialist","organization":"Latitude.sh"}]},{"id":"f25174c2-c80e-4940-8f0f-2823e076581e","date":"October 1, 2026","start":"1:00 PM PT","end":"1:25 PM PT","title":"Closing the Gap Between AI Ideas and Business Impact","track":"Lunch Breakout Session","room":"Theater 4","description":"The first wave of AI adoption was dominated by pilots, chat bots, and POCs, but the time for experimentation is over. Now, businesses are focused on delivering measurable outcomes quickly, securely, and with predictable costs. Operationalizing AI transformation can be intimidating, but IT leaders have been preparing for this moment for years–they just might not know it. In this breakout session, you will learn about how your business can cross the two chasms separating you from achieving your AI transformation goals–the purpose chasm and the production chasm. Learn how to identify the best opportunities for impact and how your existing investments in cloud transformation provide a strong foundation for your AI transformation journey.","speakers":[{"name":"Jonathan LaCour","role":"Director, AI and Cloud Technology","organization":"CDW"}]},{"id":"02391036-220a-446d-8317-7f6c4e548db7","date":"October 1, 2026","start":"1:00 PM PT","end":"1:25 PM PT","title":"Scaling AI: Design to Deployment Continuum Validating AI Infrastructure at Scale","track":"Lunch Breakout Session","room":"Theater 5","description":"As demand for AI-driven solutions grows at an unprecedented scale, the technology industry must overcome complex scalability challenges at every layer, from chiplets to massive AI clusters. This presentation introduces \"ScaleX\"—a comprehensive framework defining the dimensions of scale: scale-in, scale-up, scale-out, scale-across, and scale-above. We will explore the critical infrastructure hurdles currently facing the industry and examine the diverse architectural approaches being deployed to solve them.  \n\nBuilding high-performing AI applications and agentic systems requires looking beyond the foundational model. It demands optimized inference workflows, network and storage architectures that prevent token-throughput bottlenecks, and rigorous security guardrails that balance efficacy with performance. This session demonstrates how advanced tooling and telemetry can unify these requirements into a single, data-driven feedback loop. Attendees will learn how to refine prompt engineering while serving reliable inference, simulate real GPU memory and storage access patterns to minimize latency, and stress-test security layers against adversarial attacks and data leakage. Ultimately, this presentation provides a path for engineering AI applications that are inherently fast, cost-efficient, and secure.","speakers":[{"name":"Venkat Pullela","role":"CTO, AI Infrastructure","organization":"Keysight"}]},{"id":"ceb3091f-a6d1-4ebe-aaeb-db0396057785","date":"October 1, 2026","start":"1:00 PM PT","end":"1:25 PM PT","title":"Two Halves of Inference to Build, Eval & Run Agents","track":"Lunch Breakout Session","room":"Theater 2","description":"The AI stack is changing, but whether you’re building an agent or fine-tuning an LLM, the same problem remains: you need the right context to build, evaluate, and deploy reliable AI systems.\nMany failures that look like model or prompt problems are actually context problems, with agents making confident decisions that are inaccurate or based on stale data. \nEvals have the same context problem. If you evaluate an agent or fine-tuned LLM against non-realistic or incomplete context, you can’t know how it will perform on the tasks and data it will encounter in production.\nIn this hands-on presentation, Chalk Co-Founder Elliot Marx will show how a unified context layer solves both. A context layer is the missing decision infrastructure to give live, governed data to agents and models at inference time - querying your data where it already lives, so every AI decision gets the real-time context it needs. The same system powers testing and evals, so you can prove that your agent is production-ready.\nWith a context layer, you turn data that helps AI understand the world it’s acting on into agent context at the moment of inference - and run the full AI decision system. He’ll demonstrate the full workflow across use cases, from fine-tuning an open-weight LLM and serving it in your own cloud to testing an agent in a simulated time-bound environment with knowledge-cutoff data and tool access, evaluating against real-world tasks, and deploying in a sandbox. \nFinally, Elliot will share practical lessons from building context and infrastructure for ML and agentic systems used by companies like Whatnot, Turo, and Mission Lane, and a framework for making context and evals a core part of how you build AI.","speakers":[{"name":"Elliot Marx","role":"Co-Founder","organization":"Chalk"}]},{"id":"9daa5f2f-07db-4708-85ba-3bffd1bc8bb1","date":"October 1, 2026","start":"1:00 PM PT","end":"1:10 PM PT","title":"Runtime is Where AI Lives","track":"Lunch Lightning Talk","room":"Theater 3","description":"Your AI stack didn't add a new application. It added a newparticipant.\nAgents now make calls, invoke tools, read untrusted content, and act on your systems with credentials of their own — and almost all of it happens at Layer 7, in runtime, where your existing controls were never designed to look. AI opened four new doors at once: autonomous agents, prompt injection, the model supply chain, and identity sprawl. Meanwhile attackers do what they've always done — move across identity, apps, APIs, data, and infrastructure without respecting the tool boundaries we bought.\nThis session makes the case that runtime is becoming the control plane for modern security, and shows what that actually changes day to day: vulnerability management driven by what's exposed and reachable instead of a CVSS backlog; detection built on behavior instead of static signatures; and the shift frompanic patchtorapid protection— reduce risk now, patch on your timeline.\nBrian Joe, CPO and co-founder of Impart Security, will walk through the four AI threat vectors, the unified runtime view, and a practical picture of SecOps in the AI era.","speakers":[{"name":"Brian Joe","role":"Co-Founder and CPO","organization":"Impart Security"}]},{"id":"8188d10e-d8c8-4283-9b81-a4fc8973b3c3","date":"October 1, 2026","start":"1:00 PM PT","end":"1:25 PM PT","title":"Post-training is the new product moat: why the application layer started training its own models","track":"Lunch Mainstage Talk","room":"Theater 1","description":"Two years ago, post-training was a research term and a checkbox on an inference bill. Today Cursor, Cognition, Harvey and others ship their own models, built on open weights and sharpened with reinforcement learning — not because they wanted to become model labs, but because prompting a general model was no longer good enough for their products.\n\nThis talk traces how that shift happened and what it means for anyone building AI products. I'll cover the four preconditions that made it possible: open-weight models good enough to specialize, verifiable rewards that made RL practical outside a lab, agents that raised the bar from plausible answers to reliable task completion, and the economics of a small custom model beating a frontier API. I'll then look at how the vendor landscape has organized itself — who sells post-training today, and how much of the work each option leaves in your hands.\n\nDrawing on post-training Llama 3 and 4 at Meta, co-founding Eigen AI, and now leading AI training at Nebius, I'll share how we approach this at Nebius: an AI cloud where training tooling — both our own and our partners' — sits directly on the compute, so teams can post-train their own models without stitching together a stack. I'll ground this in a recent customer case and close with three predictions about where post-training goes next.","speakers":[{"name":"Di Jin","role":"VP of AI Training","organization":"Nebius"}]},{"id":"72e7cbca-3c76-4301-841a-8e721525f651","date":"October 1, 2026","start":"1:15 PM PT","end":"1:25 PM PT","title":"The Last Agent Architecture","track":"Lunch Lightning Talk","room":"Theater 3","description":"Models change monthly. Prompts change weekly. The need to re-architect your agent stack feels like a quarterly necessity. Change is inevitable—so build like it. This talk explains how to set up a sovereign stack that sticks—flexible primitives, deep observability, and an execution layer that allows for continuous change.","speakers":[{"name":"Mitchell Alderson","role":"Senior Content Engineer","organization":"Inngest"}]},{"id":"2db382a0-37a2-415f-82eb-fb08c00db69e","date":"October 1, 2026","start":"1:30 PM PT","end":"1:55 PM PT","title":"Rebuilding Search for the Agentic Web","track":"Lunch Breakout Session","room":"Theater 5","description":"Abstract: The internet is splitting into two layers: one for humans and one for machine intelligence. This shift creates a new search paradigm, where more compute expands how agents discover, reason, and act. Learn what the next layer of the agentic web requires.  \n\n \n\nOutline:  \n\nWhat Tavily is: the web access layer for AI agents  \n\nHistory of the web: humans -> rise of agents \n\nThe internet is splitting into two layers: one optimized for human attention, another for machine intelligence  \n\nSearch becomes an iterative process: agents search, read, identify gaps, verify claims, and search again  \n\nMore compute means better search \n\nImportance of agent harness. Retrieval, tools, memory, permissions, and evaluation determine what an agent can actually do  \n\nSearch is part of the learning loop: agents can learn which sources to trust, when to corroborate, and when to abstain  \n\nThe next layer of the agentic web: reliable, structured, source-backed web access that lets agents observe, reason, act, and improve","speakers":[{"name":"Rotem Weiss","role":"Founder and CEO","organization":"Tavily"}]},{"id":"32d06950-39ab-4617-aebb-00813e19abb4","date":"October 1, 2026","start":"1:30 PM PT","end":"1:55 PM PT","title":"The Agentic OS: a first-principles approach to building agents that get things done","track":"Lunch Breakout Session","room":"Theater 2","description":"AI agents are remarkable. They've given us the ability to reason over complex, multi-dimensional knowledge and capabilities across an organization, and take actions at a scale that previously demanded far more time and resources. There is a meaningful gap, though, between agents that demo well (AI always demos well) and agents that actually move the needle.\nAs the agentic discourse moves from models and frameworks to scaled deployment and ROI, the harder question is whether agents can survive contact with a real organization: real data, fragmented systems, ambiguous outcomes, and decisions that carry actual risk.\nThis talk draws from our experience at Postman building and operating a family of 30+ AI agents in production across our enterprise organization. Integrations multiplied, context fragmented, and the emerging mesh of agents calling one another began to resemble the distributed-system architectures many of us spent the last decade learning to avoid. AI-native is not just about deploying more agents, and much more about making the business legible to them: domains, judgment, strategy, permissions, and outcomes.","speakers":[{"name":"Harry Mower","role":"Field CTO","organization":"Postman"}]},{"id":"12ed0b60-a6b6-4773-9c00-a5ae5c75be56","date":"October 1, 2026","start":"1:30 PM PT","end":"1:55 PM PT","title":"Your agent pays twice for every search: how we cut token spend by 90+% with better accuracy","track":"Lunch Breakout Session","room":"Theater 4","description":"Every agent that searches the web pays twice: once for the search call, and again for the tokens that search puts into the model's context. The answer is usually a few sentences. The agent pays for the whole page, and in a multi-step loop it pays for it again on every turn.\nWe'll show real production traces of where the tokens go and why retrieval, not generation, is the biggest line on most agent bills. Then we'll show what we changed: return the passages a query needs instead of whole pages, tune extraction to the question, and cap how much context the agent can take. We tested this across 12 frontier models and 11,000 blind-graded answers. Token spend fell by more than 90% while accuracy went up.\nYou get a metric (cost per correct answer, not cost per request), an open calculator to run the numbers on your own traffic, and a five-point checklist for finding token waste in your pipeline.","speakers":[{"name":"Louis Walsh","role":"Head of Forward Deployed Engineering","organization":"Exa"}]},{"id":"1fa397d6-a0b7-4812-9854-694030e21d6e","date":"October 1, 2026","start":"1:30 PM PT","end":"1:40 PM PT","title":"Architecting Voice AI for ROI","track":"Lunch Lightning Talk","room":"Theater 3","description":"Voice AI is the fastest path to ROI in the contact center because it hits your most costly channel on day 1. But the return is architected, not automatic. It comes from two early decisions: pointing the agent at the right high-volume, measurable conversations to start, and getting those conversations to actually feel human, so callers stay engaged instead of asking for a person. Get that right and the results follow, the way Amazon Ring's did, ramping from a small slice of calls to their full frontline volume in just 2 weeks. The teams that win don't stumble into ROI. They design for it, starting with the very first call.","speakers":[{"name":"Dhwani Trivedi","role":"Agent Engineer","organization":"Vapi"}]},{"id":"9f42eb4a-46ba-4605-b896-b1314ad77c0e","date":"October 1, 2026","start":"1:30 PM PT","end":"1:55 PM PT","title":"What Trusting an Agent With 65,000 Files Taught Us","track":"Lunch Mainstage Talk","room":"Theater 1","description":"For most people, AI assistants start with finding and summarizing, and in the usage we see across AI tools connected to a shared file store, that is where most of it stays: the majority of requests are retrieval, and about half of users ever take an action on a file. Acting on real, shared work is a different bar: reorganizing a folder a colleague depends on, renaming a thousand files to a convention, assembling a package for a client. In our experience, the gap between an assistant that suggests and one that finishes is rarely model quality. It is trust, and trust can be designed in.\nThis session reports what we learned building an agent that operates on shared, permissioned content at scale: nine organizations running it on their own files for months, including a 65,000-file archive, and side-by-side tests against general-purpose chat agents. It lays out what changed the behavior of the people who moved from asking to acting.\nWhat the audience will take away:\nThe trust ladder. Adoption starts with low-risk, reversible actions (organize, rename, convert) and climbs from there. Skipping rungs loses people.\nFive controls before an agent touches shared files: a plan the user can read and edit; write access granted per scope and enforced server-side, never by the model; rollback for every change, verified against the actual file state; a record of what ran, when, and on whose behalf; and results that land where the team already works, in sync, rather than in a copy.\nContext lives with the content. Why a file system with history, permissions and collaborators is a better substrate for an agent than a chat window, and how to keep that context open to any model and any tool through standard interfaces rather than locking it to one.\nWe will share what the research changed in the design: why an approval step has to behave the same way every time before people can learn to trust it; why a plan that is complete but unread is a failed plan, and what made people read it; why the language the agent uses while it works matters as much as the result; and why undo moved adoption further than any gain in accuracy. Attendees leave with a checklist for evaluating or building agents that people will let near their work.","speakers":[{"name":"Vijay Rangarajan","role":"Vice President of Product Management","organization":"Dropbox"}]},{"id":"69813568-3dad-40bc-b353-129f2f3f7791","date":"October 1, 2026","start":"1:45 PM PT","end":"1:55 PM PT","title":"The Rise of Open Models: Why Pay for Frontier?","track":"Lunch Lightning Talk","room":"Theater 3","description":"Most engineering orgs default to frontier models for everything. In this session, I'll walk through the routing policy Faros built and validated on hundreds of real engineering tasks, using an execution-free eval framework that works across any codebase without test infrastructure. Open models matched frontier quality on most task types at roughly half the cost. You'll leave knowing which tasks still need frontier models and why. Plus how to run the same analysis on your own work.","speakers":[{"name":"Chase Norton","role":"Head of AI","organization":"Faros"}]},{"id":"607dcbde-0a57-4178-827c-579c7217c3bf","date":"October 1, 2026","start":"2:00 PM PT","end":"2:25 PM PT","title":"From Recommendations to Agents: Building Goal-Driven Consumer AI at DoorDash","track":"AI Builders","room":"Theater 2","description":"Modern consumer AI is moving beyond one-shot predictions toward systems that actively\nreason, plan, and adapt. In this talk, Sudeep explores how personalization is evolving from\nstatic recommender systems into agentic, goal-driven AI experiences that operate across\nsearch, discovery, decision-making, and execution. Drawing from real-world production\nsystems, the session covers how large language models, deep learning, and\nreinforcement-style feedback loops can be combined to build consumer-facing agents that\nunderstand intent, maintain context over time, and take coordinated actions on behalf of\nusers. Topics include agentic product discovery, multi-step decision flows, trust and\ncontrollability in consumer agents, and practical evaluation strategies for these systems at\nscale. Attendees will leave with concrete frameworks for designing AI systems that feel\nhelpful, adaptive, and human-centered—while remaining reliable, efficient, and grounded in\nreal business constraints.","speakers":[{"name":"Sudeep Das","role":"Head of AI, New Verticals","organization":"DoorDash"}]},{"id":"68226ccc-a4fe-4aa5-ad07-5cadb0627e6a","date":"October 1, 2026","start":"2:00 PM PT","end":"2:25 PM PT","title":"The New Economics of AI.","track":"AI Frontiers","room":"Theater 1","description":"This talk builds on our State of AI report released in December 2025, one of the largest empirical studies of real-world LLM usage to date, analyzing 100 trillion tokens of inference data from the OpenRouter platform. Rather than relying on benchmarks, we examine how models are actually used in practice across tasks, geographies, and time. Among the original findings: open-weight models now serve roughly a third of all tokens in an increasingly fragmented ecosystem, creative roleplay is the dominant open-source use case, and programming is the fastest-growing category overall. We'll revisit these findings with fresh data and updated trends, including the continued rise of agentic inference (multi-step, tool-integrated workflows) alongside cost-usage dynamics, geographic shifts, model retention patterns, and what these evolving patterns mean for model builders, infrastructure operators, and investors.","speakers":[{"name":"Malika Aubakirova","role":"Founding Team, Stealth","organization":"ex-Andreessen Horowitz"},{"name":"Chris Clark","role":"Chief Operating Officer and Co-Founder","organization":"OpenRouter"}]},{"id":"aed3533e-1355-4e0b-8a30-a26c29e7eb33","date":"October 1, 2026","start":"2:00 PM PT","end":"2:25 PM PT","title":"Securing Enterprise and Sovereign AI at Runtime","track":"AI Strategy","room":"Theater 5","description":"Enterprise and sovereign AI are already moving into production. Agents are retrieving sensitive data, calling models and tools, taking actions, and generating detailed traces. Traditional security protects data at rest and in transit, but it leaves a gap as sensitive information moves through prompts, agents, models, tools, and regions.\n\nThis session looks at how Runtime AI Data Control addresses that gap. You’ll learn where sensitive data shows up across agent workflows, why agent traces require a different approach than traditional logs, and how to protect sensitive data without limiting what AI systems can do or where they can operate.\n\nWe’ll also share lessons from real deployments, common failure points, and a practical way to assess whether enterprise and sovereign AI systems are ready to scale securely.\n\nKey talking points: \n* Where sensitive data shows up across an agent workflow, from retrieval and prompts to tool calls, memory, outputs, and traces\n* Why an agent trace is not the same as a traditional log: a log describes the system, while a trace can describe a person\n* How Runtime AI Data Control protects sensitive data across enterprise and sovereign AI deployments without limiting what AI systems can do\n* What it takes to scale enterprise and sovereign AI, including common failure points and practical lessons from real deployments","speakers":[{"name":"Amruta Moktali","role":"Chief Product","organization":"Skyflow"}]},{"id":"d49ba0bc-9b86-4358-a1c3-067a674fbfd9","date":"October 1, 2026","start":"2:00 PM PT","end":"2:25 PM PT","title":"From Demo to Production: Agents That Hold Up","track":"Applied AI","room":"Theater 4","description":"Every hour spent making infrastructure work for agents is an hour developers could spend making agents more useful. A general-purpose VM gives an agent somewhere to run, but leaves the developer responsible for preserving context, securing generated code, coordinating subagents, governing tool access, and tracking costs across services. As agents take on longer and more ambitious tasks, supporting infrastructure becomes a substantial engineering project of its own.\nThis talk explores computing primitives designed around how agents actually work: bursts of execution, waits for models and tools, and sessions that pause, branch, and continue. We will go beneath the APIs to examine hardware virtualization with Firecracker microVMs, the roles of Linux namespaces and cgroups, and how CPU accounting supports billing for actual consumption. We will then connect those foundations to reusable environment templates, swarms of agents, governed actions, and observability that turns execution traces into signals for improvement. Using DigitalOcean Managed Agents as the concrete example, we will show how bringing execution, inference, storage, and tool consumption onto a single bill helps teams understand the cost of successful work and spend more engineering time improving it.","speakers":[{"name":"Salman Paracha","role":"SVP, AI","organization":"DigitalOcean"}]},{"id":"723c8004-2afd-47a0-a68f-c40da28b2172","date":"October 1, 2026","start":"2:00 PM PT","end":"2:25 PM PT","title":"Scaling Enterprise RAG Systems: Distributed Indexing and Dynamic Retrieval for Terabyte-Scale Knowledge Systems","track":"The AI Stack","room":"Theater 3","description":"Standard vector search architectures collapse under the weight of indexing latency, ballooning storage costs, and degraded retrieval precision when enterprise RAG systems scale to terabyte-scale production knowledge bases, hitting a Scaling Wall.\n\nThis session explores the engineering patterns required to build a high-throughput enterprise search infrastructure. Using our production implementation as a case study, we graduate from basic vector stores to a distributed indexing strategy. We will analyze the critical trade-offs between Approximate Nearest Neighbor (ANN) accuracy and memory overhead, the impact of hybrid metadata-vector filtering on query latency, and the necessity of partitioned retrieval architectures to maintain sub-second response times.\n\nAttendees will gain a blueprint for a \"Knowledge Lake\" architecture, learning how to handle incremental indexing at scale, manage vector infrastructure costs, and implement dynamic query routing to ensure system consistency across distributed environments.\n\nKey Takeaways:\n* Distributed Indexing & Sharding: Partition billion-vector datasets across distributed nodes using HNSW/IVF algorithms to ensure sub-second retrieval without exhausting cluster memory.\n* Trade-off - ANN accuracy vs Memory: Tune ANN indexes for billions of vectors, balancing retrieval speed against infrastructure spend with tiered storage.\n* Partitioned Retrieval & IVF Strategies: Engineering strategies for segmenting vector space using Inverted File Indexing (IVF), centroid-based sharding, and cluster-level pruning to achieve high search completeness with minimal compute overhead.\n* Hybrid Filtering & Routing: Implementation patterns for combining structured metadata filters with vector similarity to optimize retrieval performance.\n* Operational Consistency: Monitoring ingestion lag, managing incremental indexing, and ensuring data integrity across distributed vectors.\n\nEngineering Trade-offs & Operational Insights:\n* Ingestion Scaling vs. Index Freshness: Dynamic task mapping in Airflow and Spark to parallelize the embedding bottleneck while managing vector database write-limits.\n* Vector Storage Economics: Reducing high-dimensionality embeddings cost through product quantization (PQ) and binary hashing.\n* System Resiliency: Handling retrieval hot spots and implementing circuit breakers for bulk data backfills that threaten to saturate vector endpoints.","speakers":[{"name":"Yuri Shelke","role":"Distinguished Engineer","organization":"Capital One"}]},{"id":"9c6fd007-3778-4725-9623-2e3ffcd54577","date":"October 1, 2026","start":"2:30 PM PT","end":"2:55 PM PT","title":"Harness Engineering: What Changes When Agents Write Most of the Code?","track":"AI Builders","room":"Theater 2","description":"As coding agents get better, the limiting factor is no longer just model capability. It is whether your team has built the right harness around the model: the codebase structure, task boundaries, feedback loops, evals, tests, review processes, and operational guardrails that let agents work effectively over longer time horizons.\n\nThis talk will cover the emerging shift from pair programming with AI to agentic delegation. It will examine what kinds of engineering work agents handle well today, where they still break down, and what changes teams are making to get useful results in practice. Topics will include how to make a codebase more agent-friendly, how to scope tasks so agents do not thrash, how to use tests and evals as control systems, and how human review changes when the AI is doing more of the implementation work.\n\nAttendees will leave with a practical framework for thinking about “harness engineering,” along with concrete patterns they can apply to code review, task design, evals, and team workflows as AI systems take on a larger share of software development.","speakers":[{"name":"Charlie Guo","role":"Developer Experience Engineer","organization":"OpenAI"}]},{"id":"2c8c2e5a-a74c-4ed8-99f5-b1613682f8a4","date":"October 1, 2026","start":"2:30 PM PT","end":"2:55 PM PT","title":"The Million-Dollar Pilot Trap: Why Most AI Agents Never Scale","track":"AI Frontiers","room":"Theater 1","description":"AI experimentation is everywhere. Enterprise-scale AI deployment is not. While organizations race to adopt AI agents, many remain trapped in pilots that never deliver meaningful business value. The challenge isn't access to AI. It's building the operational foundation required to deploy AI securely, govern it effectively, and scale it across the enterprise. What can we learn from enterprises already running AI agents in production across millions of customer interactions? Dive into the realities of operationalizing AI, the governance models that build trust, and the measurable outcomes organizations are achieving today.","speakers":[{"name":"Geoff Works","role":"Regional Vice President of Agentic AI Sales","organization":"NiCE"}]},{"id":"613c8f19-adbf-43a6-9ad5-c864f6129b88","date":"October 1, 2026","start":"2:30 PM PT","end":"2:55 PM PT","title":"Human Safety Was Hard Enough. Now We Have Agents.","track":"AI Strategy","room":"Theater 5","description":"For the last decade, platform safety meant one thing: keeping humans safe from adversarial humans online. We built systems, policies, and entire product organizations around that assumption. That assumption is now obsolete.\n\nWe are entering a world with three new safety vectors that no platform has fully mapped yet: adversarial humans manipulating agents to cause harm, agents causing harm to humans, and agents in conflict with each other. The platforms sitting in the middle have no rulebook, no established liability framework, and in most cases, no product roadmap that accounts for any of this.\n\nI’ve spent the last five years building Trust & Safety platforms at scale, across content moderation, fraud detection, youth safety, and messaging integrity. The hardest problems I’ve worked on involved adversarial human actors behaving in ways we could anticipate, model, and eventually defend against. Agents are a different category entirely. They can learn, adapt, and cause harm in ways that no policy written today will cleanly cover. And when harm happens, the accountability question becomes genuinely unsolved: is it the platform? The agent? The company that built the model? The user who trained it? Or all of the above?\n\nThis talk maps the new safety surface that product and platform leaders need to start designing for now, while the field is still early enough to shape it thoughtfully. We will walk through each harm vector, the accountability gaps each one creates, and the product and governance questions leaders need to be asking today.\n\nAttendees will leave with an understanding of the emerging agent safety surface, a framework for thinking through accountability across the four-way responsibility stack, and the specific product questions they should be bringing into roadmap conversations right now.","speakers":[{"name":"Vidya Srinivasan","role":"Product Staff","organization":"Meta"}]},{"id":"a303c875-3357-45b5-a454-8209e3147150","date":"October 1, 2026","start":"2:30 PM PT","end":"2:55 PM PT","title":"Beyond the Benchmark: Building for the Complexity of Real Marketplaces","track":"Applied AI","room":"Theater 4","description":"Most AI research is evaluated against static benchmarks with clean labels, single-language inputs, and well-defined reward functions. But what happens when those models meet a live, global, two-sided marketplace, where hiring signals are sparse, feedback is delayed by weeks and queries span 30+ languages? The difference between a good recommendation and a bad one has a real impact on outcomes for all players in a marketplace.\n\nThis talk walks through what it actually takes to build a robust, end-to-end AI experience for a global talent marketplace. It presents five research contributions from Upwork: four that each solve a critical layer of that stack, and a fifth that tackles how to evaluate the AI agents increasingly operating within it.\n\nIt starts with matching. GraphMatch fuses language models with graph neural networks to capture the relational structure (who's worked with whom, how skills connect, how the marketplace evolves) that text embeddings alone miss. But finding the right candidates is only the beginning. They need to be ranked for hiring intent, not clicks, which is what Rank-Aware Indigo-DPO delivers, using preference optimization across 30+ languages to align search results with actual hiring outcomes. Even with strong matching and ranking, marketplace feedback arrives late: a hire confirmed weeks after a search session is still a valuable signal. IF-DFM uses influence functions to keep conversion models fresh without retraining, closing up to 85% of the gap to an oracle with perfect labels. And all of this has to run at production speed. DispatchQA demonstrates that a fine-tuned 8B parameter model matches GPT-4o on search function-calling at half the latency.\n\nSeparately, as AI agents increasingly participate in marketplaces like Upwork, not just powering the platform but doing the work, we need new ways to evaluate them. UpBench, our fifth contribution, is a dynamically evolving benchmark grounded in hundreds of real Upwork jobs, evaluated by expert freelancers using hand-crafted rubrics. It reveals that today's best agents complete fewer than half of real professional tasks on their first attempt, and that human-in-the-loop feedback rescues roughly one in five failures.\n\nTogether, these five papers offer a view from inside a team building AI where the stakes are real, the signals are noisy, and the users are on both sides of every transaction.","speakers":[{"name":"Jon Pappas","role":"Sr. Dir. Technical Product Management","organization":"Upwork"}]},{"id":"6d65214e-f5f3-4462-bc59-b5009af976d5","date":"October 1, 2026","start":"2:30 PM PT","end":"2:55 PM PT","title":"Rethinking Inference for the Agent Era","track":"The AI Stack","room":"Theater 3","description":"Agents have changed the economics of AI inference. A chatbot’s cost scales roughly linearly with the number of requests; an agent’s scales multiplicatively. A single task can fan out into hundreds of model calls, each carrying a repeated context prefix and adding latency that compounds across tool calls and reasoning steps. As open-weight models keep improving and agentic workloads grow, this shift exposes the limits of traditional request-level optimization. Inference infrastructure becomes a first-class concern, one that often shapes performance and cost as much as the model itself. In this talk, we explore what changes when you optimize for the whole task rather than the individual request, and how FriendliAI is rethinking the inference cloud for the era of agentic AI.","speakers":[{"name":"Gon Chun","role":"CEO","organization":"FriendliAI"}]},{"id":"4fc2cf2d-41a9-4166-a2bb-88553e357f0b","date":"October 1, 2026","start":"3:00 PM PT","end":"3:25 PM PT","title":"True Zero Data Retention Is Structural, Not a Clause in a Contract","track":"AI Builders","room":"Theater 2","description":"Every model that touches the web inherits the privacy policy of its search provider. This means Zero Data Retention is only enforceable up to the boundary of your search vendor's vertically integrated stack—if they’re secretly calling an external index for some queries, then you can’t guarantee true ZDR for your users. In this talk, you’ll get practical advice for how to trace the retrieval path your queries actually take; how to verify end-to-end privacy; why agents are compounding this privacy gap; and three questions to take back to your team to ensure reliably enforceable ZDR across all endpoints without degradation in result quality.","speakers":[{"name":"Carlos Acevedo","role":"Senior Director, Business Development","organization":"Brave"}]},{"id":"a06ad5bf-2cf7-41fe-a6f6-7e96cebb9105","date":"October 1, 2026","start":"3:00 PM PT","end":"3:25 PM PT","title":"From Policy to Practice: Scaling Responsible AI Inside a Global Bank","track":"AI Frontiers","room":"Theater 1","description":"Terah Lyons has seen AI governance from both sides — as the architect of the first U.S. national AI policy strategy and founding CEO of the Partnership on AI, and now as the person responsible for turning policy into practice inside one of the world's largest financial institutions. In this fireside chat with Washington Post tech reporter Gerrit De Vynck, Lyons shares concrete lessons from deploying AI at scale inside JPMorganChase — what responsible adoption actually looks like under real regulatory and operational constraints, where global governance frameworks help versus where they slow real execution, and what it takes to balance innovation with safety when the stakes, and the scrutiny, are this high.","speakers":[{"name":"Gerrit De Vynck","role":"Tech Reporter","organization":"Washington Post"},{"name":"Terah Lyons","role":"Global Head of AI & Data Policy","organization":"JPMorganChase"}]},{"id":"2a73438a-d096-4d9b-bb11-77518968c70c","date":"October 1, 2026","start":"3:00 PM PT","end":"3:25 PM PT","title":"5 Teams, 5 Different AI Strategies: Here's What Worked","track":"AI Strategy","room":"Theater 5","description":"Last year, five teams at International Materials set out on five different paths to adopting AI. Different tools, different builders, different levels of oversight. This session covers a rare dataset in enterprise AI: each approach, how it went, the trade offs, and the long term lessons.","speakers":[{"name":"Ernesto Morales","role":"Vice President, Information Technology","organization":"International Materials"},{"name":"Mollie Breen","role":"Co-founder & CEO","organization":"OverAI"}]},{"id":"98e4649a-7e7b-4e46-9899-d993c6b6130c","date":"October 1, 2026","start":"3:00 PM PT","end":"3:25 PM PT","title":"Our Agent Resolves Production Bugs in Minutes. Here's What We Learned","track":"Applied AI","room":"Theater 4","description":"At Navan, production issues accumulate in Jira while engineers manually trace errors across three disconnected systems — the ticket description, New Relic observability data, and the responsible codebase — before they can even begin fixing anything. With 120+ microservices, this triage-to-resolution cycle averaged 4.2 hours per ticket. Roberto Milev and Uday Kanagala (Navan) built an agent that does it in 9 minutes.\n\nSherlock is an end-to-end autonomous agent that resolves production issues by orchestrating across Jira, New Relic, and GitHub. Given a Jira ticket — whether it contains a precise exception message or just a screenshot of a generic error page — the agent autonomously traces the error through production stack traces, identifies the responsible service and code, generates a fix, and opens a pull request. It runs on Claude SDK deployed as Docker containers on AWS AgentCore runtime, with MCP tool servers providing authenticated access to each system.\n\nThe hardest engineering problem was observability-driven error tracing. Tickets vary wildly in specificity. The agent extracts candidate error signatures from ticket content (including screenshots), formulates NRQL queries against New Relic, and uses time-window scoping — the ticket's creation timestamp and temporal references in the description — to constrain the search across 120+ services. It iteratively refines queries until it converges on matching error occurrences, retrieves full stack traces, and maps them to specific files and line numbers. This transforms a vague report like \"recommendations aren't loading\" into a precise pointer to the failing method.\n\nA critical design decision: the agent operates on a full local clone of the repository, not API-based file access. It reads the failing class, its imports, dependent services, configuration files, and existing test suites. It also ingests agentic context files (CLAUDE.md) that describe business logic and conventions — giving it the same onboarding context a new engineer would receive. This produces convention-aware fixes that follow the repository's existing patterns.\n\nNot every ticket can be fully resolved autonomously. Sherlock is designed for graceful degradation: it goes as far as available information allows, documents its progress, and pauses when it needs human input. The workspace — cloned repo, analysis state, session context — is persisted across AgentCore Memory, S3, and ECS. When a human replies with direction days later, the agent resumes exactly where it left off.\n\nEvaluated on 100 production tickets: 41% fully resolved (PR created), 38% partially resolved (diagnosis posted to ticket), 9-minute average time-to-PR, 68% PR acceptance rate after human review, and 72% error recovery rate when initial tool calls failed.\n\nKey takeaways:\n- Architecture for safe autonomous debugging across disconnected enterprise systems\n- When agents should stop and ask for help — designing graceful degradation into production agent systems\n- Practical patterns for deploying agents that interact with real production infrastructure","speakers":[{"name":"Roberto Milev","role":"Chief Architect","organization":"Navan"}]},{"id":"30daa688-47dc-4178-8a77-b00c65ddf624","date":"October 1, 2026","start":"3:00 PM PT","end":"3:25 PM PT","title":"Post-Training LLMs for Entertainment: Improving Engagement and Safety with Non-Verifiable Rewards","track":"The AI Stack","room":"Theater 3","description":"Training LLMs for entertainment applications, such as AI characters and interactive storytelling, presents a unique opportunity: how to develop models that are engaging and safe. Measuring model responses is a specialization where there is not merely a set universe of objective criteria, as in other fields. As a result, we often use signals from user behavior, such as swipe interactions and whether a user continues the conversation or disengages, to infer preferences and guide model improvements. \n\nThis talk will explore how we approach post-training in this setting using reinforcement learning with real-world user interaction data. We will discuss how to identify which user behaviors are meaningful and how to use them to improve models despite the lack of a clear ground truth.\n\nWe will share practical techniques for balancing multiple goals. This includes methods for structuring training so the model learns from both positive signals (e.g., continued engagement) and negative signals (e.g., undesirable outputs), as well as strategies for prioritizing different objectives at different stages of training.\n\nWe will also cover how testing and training models on difficult prompts helps uncover weaknesses and improve reliability in real-world use, and how improvements discovered in larger models can be transferred to smaller, more efficient models without sacrificing performance.\n\nGrounded in real-world implementation, this session will provide a clear framework for training and improving LLMs in domains where success is difficult to measure directly. Attendees will leave with practical approaches to working with imperfect user feedback, balancing competing objectives, and applying these methods to production AI systems.","speakers":[{"name":"Manqing Liu","role":"Research Engineer","organization":"Character.ai"}]},{"id":"10d6a43c-96d6-4e44-94c8-47cac67ccb83","date":"October 1, 2026","start":"4:00 PM PT","end":"4:25 PM PT","title":"Premium Inference for the Agentic AI Era","track":"AI Builders","room":"Theater 2","description":"As AI shifts from single-turn prompts to autonomous, multi-step agents, inference speed is becoming foundational to real-world adoption. Agents must reason, retrieve, plan, call tools, and respond across complex workflows — often requiring many model interactions in sequence. This session explores why high-performance inference is critical for scalable agentic AI, and how purpose-built infrastructure can reduce latency, improve responsiveness, and lower operational cost. Featuring perspectives from General Compute, the discussion will highlight how next-generation inference clouds are helping bring faster, more practical AI systems into production.","speakers":[{"name":"Vasanth Mohan","role":"Senior Director of Product Marketing and Developer Relations","organization":"SambaNova"},{"name":"Jason Goodison","role":"CTO","organization":"General Compute"}]},{"id":"eb40367f-e9f9-4768-af84-278b6ace63e4","date":"October 1, 2026","start":"4:00 PM PT","end":"4:50 PM PT","title":"The State of AI Regulation: Policy, Law, and Industry","track":"AI Frontiers","room":"Theater 1","description":"AI regulation in the U.S. is taking shape in real time, with states moving quickly as federal agencies, courts, and industry work to keep pace. This panel brings together leaders shaping AI law, policy, and governance to examine where regulation is working, where gaps remain, and what comes next. Moderated by Washington Post tech reporter Gerrit De Vynck, the conversation will explore the tension between state and federal approaches, innovation and oversight, and what a workable regulatory framework could look like as AI capabilities continue to advance.","speakers":[{"name":"Andrew Freedman","role":"Co-Founder, Chief Executive Officer","organization":"Fathom"},{"name":"Gerrit De Vynck","role":"Tech Reporter","organization":"Washington Post"},{"name":"Kevin Frazier","role":"Professor, AI Innovation and Law Program","organization":"University of Texas School of Law"},{"name":"Rebecca Bauer-Kahan","role":"California State Assemblymember, District 16","organization":"California State Assembly"}]},{"id":"2b64c210-bcc2-4375-98d7-fe2c9fbc58c6","date":"October 1, 2026","start":"4:00 PM PT","end":"4:25 PM PT","title":"Transform Twice or Get Left Behind","track":"AI Strategy","room":"Theater 5","description":"There’s a growing trend of companies that implement AI…. and fail to see any real impact for their considerable investment. It’s relatively easy to provide access to technology – but creating durable organizational change and accelerating work is a larger (and harder) endeavor.  \n\nIn an AI-first market, if you’re only working on one transformation, you’re already behind. This talk provides an overview into the two types of fundamental transformation and reinvention modern technology companies must undertake to compete and remain relevant. \n\n\nThe first transformation is inward — changing how the organization actually operates. Reinventing processes, systems, and the assumptions underneath them, rather than layering AI on top of workflows designed for a pre-AI world. AI is an amplifier: point it at a team with a shared standard and apply creativity and you get reinvention; point it at one without it and you just multiply chaos.\n\nThe second transformation is outward — what you bring to market. Agentic AI has reset the bar for every software product. Winners now need three ingredients to get things right: the context for how work actually connects, the intent behind what a user is asking for, and the judgment to act on both. Provide one without the others and the magic never shows up\n\nMost organizations are working through one of these transformations, or neither. The ones pulling ahead are doing both at once — and treating them as a single, compounding reinvention.\n\nThis session offers a diagnostic framework leaders can apply to their own organization next week: which transformation are you neglecting, what happens when you skip either one, and how the two reinforce each other. We'll ground it in the honest, still-unfinished story of Smartsheet – a platform company working through both transformations in parallel — what’s working, what comes next, and why the journey is far from over.\n\nYou'll leave being able to name where your own transformation is stuck — and what it may cost to stay there","speakers":[{"name":"Janelle Milodragovich","role":"VP, AI Market Strategy","organization":"Smartsheet"}]},{"id":"7d2d821b-065c-4700-95b8-aaafb87d7369","date":"October 1, 2026","start":"4:00 PM PT","end":"4:25 PM PT","title":"Building a self-improving software factory","track":"Applied AI","room":"Theater 4","description":"Interactive agents aren’t scaling. Every company is coping with runaway costs, lack of governance, and difficulty automating.\n\nThis has led to the need for software factories: a closed-loop system for automating development, with primitives that provably improve throughput and efficiency over time.\n\nRight now, folks are trying to roll their own internal software factories from bare metal, solving the same problems 100 different ways. We need shared, flexible infrastructure that everyone can build upon.\n\nIn this talk, we’ll share the core building blocks every company needs to build their own self-improving software factories based on our own experience building Warp Factories:\n\nCloud infrastructure to centralize agent conversations, skills, and security permissions\nConfiguration as code for humans and agents to manage that cloud infrastructure\nMetrics for humans and agents to track efficiency and code quality, beyond “number of PRs shipped”\nSelf-improvement loops for agents to review past conversations, score the quality, and propose improvements to the skills driving the factory\nYou’ll walk away with a clear understanding of how to improve coding agent ROI, and how to deploy a system of your own using Warp Factories.","speakers":[{"name":"Zach Lloyd","role":"Founder and CEO","organization":"Warp"}]},{"id":"5469e5e6-d807-430d-9eca-882ea940c579","date":"October 1, 2026","start":"4:00 PM PT","end":"4:25 PM PT","title":"Right Query, Wrong Answer: Why AI Analytics Is So Hard, and How to Fix It","track":"The AI Stack","room":"Theater 3","description":"Every product team has an analysis backlog. Questions pile up, same metrics get re-sliced weekly, and when answers finally arrive, validation is manual and inconsistent. At many companies, the ratio is 80% execution mechanics to 20% actual thinking. We wanted the inverse.\n\nSo we built AI Analyst - an open-source, multi-agent system powered by Claude Code that automates the full analytical workflow: from a business question to a validated, stakeholder-ready slide deck in roughly 30 minutes instead of days and weeks.\n\nWhat We built:\n\nThe system orchestrates 18 specialized agents across a 4-phase pipeline - Frame, Analyze, Story, Deck - using DAG-based parallel execution. A Question Framing agent turns vague asks into testable hypotheses. Eight analysis agents run concurrently (descriptive, cohort, root cause, trend, validation, opportunity sizing). A Story Architect designs narrative beats before any chart is created - solving the \"chart looking for a story\" problem. A Chart Maker generates Storytelling-with-Data-styled visualizations with collision detection. Every output passes through 4-layer validation: structural, logical, business rules, and Simpson's Paradox checks, graded A through F.\n\nThe system includes a knowledge layer that compounds over time: query archaeology captures proven SQL patterns, a corrections log ensures mistakes are never repeated, and organization-specific context (metrics definitions, business rules, team glossary) accumulates with use. It connects to any data source - CSV, DuckDB, Postgres, BigQuery, Snowflake.\n\nWhat I learned:\n\nThe hardest part wasn't building the agents - it was getting an organization to trust and adopt AI-assisted analytics. Five real blockers emerged: security and legal approvals, data classification concerns, warehouse access, API cost ownership, and analyst skepticism. I'll share specific tactics for each, including the one that worked best: \"show the output, not the pipeline.\"\n\nThe critical design principle: AI can execute analysis fast, but it cannot tell you what question to ask or whether the answer makes business sense. We designed the system around human validation, not human replacement. The learning flywheel - run, review, spot errors, correct, store, improve - is what makes the system get meaningfully better over time.\n\nThis talk is for data leaders, product managers, and engineers who want to democratize analytics without sacrificing rigor.","speakers":[{"name":"Hai Guan","role":"Head of Data","organization":"Ontra"}]},{"id":"28338cd5-0132-4eaf-9929-32cc589cd4ed","date":"October 1, 2026","start":"4:30 PM PT","end":"4:55 PM PT","title":"Agentic Memory, Logic, and Authorization","track":"AI Builders","room":"Theater 2","description":"This talk introduces a specific, implementable architecture for context-aware agent authorization — using structured memory as a first-class input to the policy evaluation hot path.\nThe core argument is that agent tool calls occupy a gap in the authorization model taxonomy. No single existing model handles them well:\nRBAC can confirm a user has a role that includes Jira access, but cannot scope a tool call to a specific project without creating a role per project.\nABAC can evaluate request parameters against static constraints, but requires someone to have pre-configured those constraints — it doesn't know why project ALPHA is the right scope.\nReBAC can traverse a relationship graph to determine that a user is related to project ALPHA through a team, but doesn't account for temporal context (the user was on ALPHA last quarter, now on BETA).\nThe missing input is situational context: what is this user currently working on? What has their agent been doing in this session? What tools do people in this user's role typically use?\nThe talk will present:\nA memory architecture designed for authorization — not general-purpose agent memory. Three typed stores (worker memory from identity/HR/project systems, agent session memory from conversation context, organizational baseline memory from usage analytics), each with different trust levels, update semantics, and confidence scoring. Temporal validity ranges on every fact for point-in-time audit queries. This draws on and synthesizes ideas from the academic agent memory literature (Zep/Graphiti for temporal knowledge graphs, Hindsight for belief evolution with confidence, MIRIX for typed multi-agent stores) but is purpose-built for the authorization use case.\nA write/read split architecture for the hot path. Memory facts are extracted asynchronously (tolerating LLM latency for fact extraction and confidence scoring). Authorization decisions are evaluated synchronously against pre-compiled facts using Datalog — deterministic, terminating, auditable, sub-millisecond. The evaluation does not call an LLM. It does not make network round-trips to external stores. The facts are local and pre-compiled.\nMemory-informed delegation policies. Concrete Datalog examples showing how a delegation can reference memory predicates instead of static parameter constraints. A rule that says \"allow this Jira create_issue call if the target project is one the user is currently working on, per memory, with confidence above 0.7\" — and if confidence is below the threshold, escalate to a human approval flow. Plus anomaly detection via organizational memory baselines: \"this tool is not typical for this user's role\" as a governance signal, not a hard deny.\nAn honest treatment of the unsolved problems — particularly the local authentication and configuration barrier for non-technical users, and the challenge of governing memory itself (provenance, retention, review cycles) when memory facts influence authorization decisions.","speakers":[{"name":"Robert Chiniquy","role":"Software Engineer","organization":"C1"}]},{"id":"f82f6099-ffaa-46b0-a540-950ff68f67b9","date":"October 1, 2026","start":"4:30 PM PT","end":"4:55 PM PT","title":"The AI-Pilled Organization: Why Individuals Are Accelerating and Institutions Aren't","track":"AI Strategy","room":"Theater 5","description":"Over the past year I've spent time inside more than 40 companies, from three-person startups and AI-natives like Harvey and Decagon to scaled operators like Ramp, Zapier, Notion, and Vercel to public companies like Wix, asking one question: what does it take for an organization, not just a person, to become AI-pilled?\nNearly every company we visited has individuals who are dramatically accelerated by AI, and almost none have converted that into an institutional advantage. Across the board, token spend is outrunning top-line gains, and cultural buy-in lags technical capability. The companies genuinely ahead aren't the ones that deployed the most tools; they're the ones that redesigned how work flows, how context is shared, and what humans are actually for.\nI'll walk through the self-assessment that came out of this research: the questions that reveal how AI-pilled your organization actually is, where the gaps almost always sit, and what it takes to close them.","speakers":[{"name":"Ann Miura-Ko","role":"Co-founding Partner","organization":"Floodgate"}]},{"id":"adc9426e-6d62-4402-ad76-b5537efac20e","date":"October 1, 2026","start":"4:30 PM PT","end":"4:55 PM PT","title":"Beyond the Demo: Validating Demand for AI Products","track":"Applied AI","room":"Theater 4","description":"An impressive AI demo can attract attention, but what signals show that a product is worth building and scaling? This talk explores how to distinguish initial enthusiasm from meaningful demand, test whether AI fits a real user workflow, and assess repeat usage, willingness to pay, and delivery costs. Drawing on experience in search, advertising, and fintech product management, Victoria will share a practical approach to deciding what to validate before expanding investment. Attendees will leave with key questions to guide early product decisions.","speakers":[{"name":"Wanyao (Victoria) Zhang","role":"Former Product Manager","organization":"TikTok, Shopee & SeaMoney"}]},{"id":"97df63c3-1772-454d-82cd-1c3b1e2b6bf5","date":"October 1, 2026","start":"4:30 PM PT","end":"4:55 PM PT","title":"Beyond the Demo: Shipping Computer-Use Agents in Production (What Breaks, What Scales, and Why)","track":"The AI Stack","room":"Theater 3","description":"Computer-use agents, AI systems that interact directly with browsers and graphical user interfaces, have rapidly moved from impressive demos to early production deployments. However, operating these agents reliably in real environments introduces a class of challenges that are often underestimated or ignored in early implementations.\n\nThis talk presents a practical, experience-driven examination of computer-use agents deployed in live business workflows. It traces the evolution from low-level browser control approaches (e.g., DOM- and vision-based interaction) to higher-level abstractions and orchestration layers, highlighting the architectural tradeoffs that emerged only under real-world load, UI drift, and partial system failures.\n\nKey topics include:\n\nCommon failure modes in computer-use agents, including UI volatility, non-deterministic model behavior, timing and synchronization issues, and brittle task decomposition\n\nReliability strategies such as constrained action spaces, verification loops, retries and recovery, fallback paths, and human-in-the-loop controls\n\nObservability gaps unique to UI-driven agents and practical techniques for debugging, monitoring, and post-incident analysis\n\nLatency, cost, and throughput tradeoffs when scaling computer-use agents beyond isolated tasks\n\nSecurity, compliance, and blast-radius considerations when agents operate on live systems\n\nThe talk also challenges the assumption that increased autonomy always leads to better outcomes, and proposes a more pragmatic model for deploying computer-use agents as constrained, inspectable systems rather than fully autonomous actors.\n\nAttendees will leave with a concrete mental model for evaluating when computer-use agents are appropriate, architectural patterns that improve reliability, and a set of anti-patterns to avoid when moving from demo to production.","speakers":[{"name":"Abbas Raza","role":"CTO","organization":"ReFocus AI"}]},{"id":"b9972d67-c1b3-4047-a64e-63113666b9a0","date":"October 1, 2026","start":"5:00 PM PT","end":"6:00 PM PT","title":"Closing Ice Cream Social powered by Dropbox","track":"Special Event","room":"Innovation Hub","description":"","speakers":[]}]};

const TRACK_ON = { 'Keynote': 'var(--on-soft)', 'My item': 'var(--on-soft)' };
const KEY = 'aiconf2026-planner';
const DEFAULT_CARD = { url: 'https://www.linkedin.com/in/lesia-barmina/', name: 'Lesia Barmina', sub: 'Scan to connect on LinkedIn' };
const store = Object.assign({ starred: {}, notes: {}, custom: [], onlyTracks: [], room: '', day: DAYS[0].key, view: 'all', card: DEFAULT_CARD },
  JSON.parse(localStorage.getItem(KEY) || '{}'));
delete store.hiddenTracks; // replaced by onlyTracks
const save = () => localStorage.setItem(KEY, JSON.stringify(store));

const toMin = t => { const m = /(\d+):(\d+)\s*(AM|PM)/i.exec(t || ''); if (!m) return null;
  let h = +m[1] % 12; if (m[3].toUpperCase() === 'PM') h += 12; return h * 60 + +m[2]; };
const fmt = min => { const h = Math.floor(min / 60), m = min % 60; return `${(h + 11) % 12 + 1}:${String(m).padStart(2, '0')} ${h < 12 ? 'AM' : 'PM'}`; };
const hhmmToMin = v => { const [h, m] = v.split(':').map(Number); return h * 60 + m; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function allSessions() {
  const base = DATA.sessions.map(s => ({ ...s, s: toMin(s.start), e: toMin(s.end) ?? toMin(s.start) + 30 }));
  const own = store.custom.map(c => ({ ...c, track: 'My item', speakers: [], description: '', own: true }));
  return base.concat(own).sort((a, b) => a.s - b.s || a.e - b.e || a.track.localeCompare(b.track));
}

// Current date/time in PT. For testing, open planner.html?now=2026-09-30T14:10 to fake it.
const NOW_OVERRIDE = /^(\d{4}-\d{2}-\d{2})T(\d{1,2}):(\d{2})$/.exec(new URLSearchParams(location.search).get('now') || '');
function nowPT() {
  if (NOW_OVERRIDE) return { iso: NOW_OVERRIDE[1], min: +NOW_OVERRIDE[2] * 60 + +NOW_OVERRIDE[3] };
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Los_Angeles',
    year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false })
    .formatToParts(new Date()).map(x => [x.type, x.value]));
  return { iso: `${p.year}-${p.month}-${p.day}`, min: (+p.hour % 24) * 60 + +p.minute };
}


function speakersLine(s) {
  return s.speakers.map(p => `<b>${esc(p.name)}</b>${p.organization ? ' · ' + esc(p.organization) : ''}`).join('; ');
}

const ICON_NOTE = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>';
function card(s, overlapsWith) {
  const on = !!store.starred[s.id] || s.own;
  const note = store.notes[s.id];
  // Planned + overlapping = real clash (red). Not planned but overlapping = picking it would clash (soft hint).
  const clash = on && overlapsWith;
  const cls = ['card', on && store.view === 'all' ? 'starred' : '', clash ? 'conflict' : '', !on && overlapsWith ? 'clashhint' : ''].join(' ');
  const withList = (overlapsWith || []).map(o => `${esc(o.title)} (${fmt(o.s)}–${fmt(o.e)})`).join('; ');
  return `<div class="${cls}" style="--c:${TRACK_COLORS[s.track] || '#999'}" data-id="${esc(s.id)}">
    <div class="top">
      <div class="main">
        <div class="title">${esc(s.title)}</div>
        <div class="meta">${fmt(s.s)}–${fmt(s.e)} · <b>${esc(s.room || '—')}</b> · ${esc(s.track)}</div>
        ${s.speakers.length ? `<div class="meta">${speakersLine(s)}</div>` : ''}
        ${clash ? `<div class="warn">⚠ Overlaps with: ${withList}</div>` : ''}
        ${!on && overlapsWith ? `<div class="hint">Clashes with your plan: ${withList}</div>` : ''}
      </div>
      <div class="side">
      ${s.own ? `<button class="btn small" data-del="${esc(s.id)}" title="Remove">✕</button>`
              : `<button class="star ${on ? 'on' : ''}" data-star="${esc(s.id)}" title="Add to my plan">${on ? '★' : '☆'}</button>`}
        ${note ? `<span class="hasnote" title="Has notes">${ICON_NOTE}</span>` : ''}
      </div>
    </div>
    ${note ? `<div class="note">📝 ${esc(note)}</div>` : ''}
  </div>`;
}

function render() {
  document.querySelectorAll('#days button').forEach(b => b.classList.toggle('on', b.dataset.d === store.day));
  document.querySelectorAll('#views button').forEach(b => b.classList.toggle('on', b.dataset.v === store.view));
  document.getElementById('views').dataset.v = store.view;
  document.body.classList.toggle('plan', store.view === 'plan');
  renderUpNext();

  const q = document.getElementById('q').value.trim().toLowerCase();
  const day = DAYS.find(d => d.key === store.day);
  const now = nowPT();
  const isToday = now.iso === day.iso;
  const all = allSessions();

  let list = all.filter(s => s.date === store.day);
  if (store.view === 'plan') list = list.filter(s => s.own || store.starred[s.id]);
  if (q) list = list.filter(s => [s.title, s.room, s.track, s.description, store.notes[s.id],
    ...s.speakers.flatMap(p => [p.name, p.organization, p.role])].join(' ').toLowerCase().includes(q));
  // Room dropdown: counts reflect day + search; then filter (All sessions view only)
  roomCounts = { '': list.length };
  ROOMS.forEach(r => roomCounts[r] = list.filter(s => s.room === r).length);
  document.getElementById('roomBtn').textContent = store.room ? `${store.room} · ${roomCounts[store.room]}` : 'All rooms';
  document.getElementById('roomBox').classList.toggle('on', !!store.room);
  if (document.getElementById('roomMenu').classList.contains('show')) renderRoomMenu();
  if (store.view === 'all' && store.room) list = list.filter(s => s.room === store.room);
  // Chip counts reflect day + search + room, before the track filter itself is applied
  document.querySelectorAll('#tracks .chip').forEach(b => {
    if (b.dataset.g === '*') { b.classList.toggle('sel', !store.onlyTracks.length); b.querySelector('.n').textContent = list.length; return; }
    const ts = GROUPS[b.dataset.g];
    const n = list.filter(s => ts.includes(s.track)).length;
    b.classList.toggle('sel', ts.some(x => store.onlyTracks.includes(x)));
    b.classList.toggle('zero', !n);
    b.querySelector('.n').textContent = n;
  });
  if (store.view === 'all' && store.onlyTracks.length) list = list.filter(s => store.onlyTracks.includes(s.track));
  document.getElementById('searchBox').classList.toggle('has', !!q);
  document.getElementById('found').textContent = q ? `${list.length} found` : '';

  const planned = all.filter(s => s.date === store.day && (s.own || store.starred[s.id]));
  // For every session of the day: which planned items it overlaps with
  const overlaps = new Map();
  all.filter(s => s.date === store.day).forEach(a => {
    const hits = planned.filter(b => a.id !== b.id && a.s < b.e && b.s < a.e);
    if (hits.length) overlaps.set(a.id, hits);
  });
  // Day cards show planned count per day and flag clashes, so the other day's overlaps aren't missed
  document.querySelectorAll('#days button').forEach(b => {
    const d = DAYS.find(x => x.key === b.dataset.d);
    const p = all.filter(s => s.date === d.key && (s.own || store.starred[s.id]));
    const clashes = p.filter(a => p.some(c => a !== c && a.s < c.e && c.s < a.e)).length;
    b.innerHTML = `<span class="dn">${d.num}</span><span class="dw">${d.wd} · ${d.mon}<i> · ${d.name}</i></span>
      <span class="dp ${clashes ? 'bad' : ''}">${clashes ? `⚠ ${clashes} overlapping` : p.length ? `★ ${p.length} planned` : 'nothing planned'}</span>`;
  });
  const clashCount = planned.filter(s => overlaps.has(s.id)).length;
  const count = document.getElementById('count');
  count.textContent = clashCount ? `${planned.length} · ⚠${clashCount}` : planned.length;
  count.classList.toggle('bad', !!clashCount);

  const out = document.getElementById('out');
  shownIds = list.map(s => s.id);
  if (!list.length) {
    out.innerHTML = `<div class="empty">${store.view === 'plan' ? 'Nothing planned for this day yet — star ☆ sessions in “All sessions”.' : 'No sessions match.'}</div>`;
    return;
  }

  let html = '', prevEnd = null;
  const groups = [];
  list.forEach(s => { const g = groups[groups.length - 1]; if (g && g.s === s.s) g.items.push(s); else groups.push({ s: s.s, items: [s] }); });
  groups.forEach(g => {
    if (store.view === 'plan' && prevEnd !== null && g.s - prevEnd >= 10)
      html += `<div class="gap">↕ free ${g.s - prevEnd} min (${fmt(prevEnd)}–${fmt(g.s)})</div>`;
    const live = isToday && g.items.some(s => s.s <= now.min && now.min < s.e);
    html += `<div class="slot" data-s="${g.s}" data-e="${Math.max(...g.items.map(s => s.e))}"><div class="t ${live ? 'now' : ''}">${fmt(g.s)}${live ? '<br>● now' : ''}</div><div class="list">
      ${g.items.map(s => card(s, overlaps.get(s.id))).join('')}</div></div>`;
    prevEnd = Math.max(prevEnd ?? 0, ...g.items.map(s => s.e));
  });
  out.innerHTML = html;
}

// --- setup

const tracks = [...new Set(DATA.sessions.map(s => s.track))];

document.addEventListener('click', e => {

  if (t.closest('#views button')) { store.view = t.closest('button').dataset.v; save(); render(); scrollTo(0, 0); return; }

// --- Room menu: custom list (native <select> popups can't be styled)

const nm = document.getElementById('nm'), nmText = document.getElementById('nmText'), nmStatus = document.getElementById('nmStatus');
let nmId = null;
let shownIds = [], navIds = []; // navIds: snapshot of the visible list when the sheet opened, so starring/unstarring doesn't reshuffle it
const growNotes = () => { nmText.style.height = 'auto'; nmText.style.height = Math.max(170, nmText.scrollHeight + 2) + 'px'; };
function renderSheet() {
  const s = allSessions().find(x => x.id === nmId); if (!s) return;
  const on = s.own || !!store.starred[s.id];
  const others = allSessions().filter(o => o.date === s.date && o.id !== s.id && (o.own || store.starred[o.id]) && o.s < s.e && s.s < o.e);
  const list = others.map(o => `${esc(o.title)} (${fmt(o.s)}–${fmt(o.e)})`).join('; ');
  document.getElementById('nmWarn').innerHTML = !others.length ? '' : on
    ? `<div class="warn">⚠ Overlaps with: ${list}</div>` : `<div class="hint">Clashes with your plan: ${list}</div>`;
  const star = document.getElementById('nmStar');
  star.hidden = !!s.own;

function openNotes(id) {
  navIds = shownIds.includes(id) ? shownIds.slice() : [id];

function fillSheet(id) {
  const s = allSessions().find(x => x.id === id); if (!s) return false;
  nmId = id;
  const i = navIds.indexOf(id);
  const all = allSessions();
  [['nmPrev', i - 1, '‹ Previous'], ['nmNext', i + 1, 'Next ›']].forEach(([btn, j, word]) => {
