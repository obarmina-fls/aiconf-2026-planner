  save(); nmStatusText(true); growNotes();
}
function hideSheet() {
  if (!nm.classList.contains('show')) return;
  nmSave(); nm.classList.remove('show'); document.body.classList.remove('modal-open'); nmId = null; render();
}
function closeNotes() {
  if (!nm.classList.contains('show')) return;
  if (history.state && history.state.sheet) history.back(); else hideSheet(); // popstate -> hideSheet
}
window.addEventListener('popstate', () => { hideSheet(); if (typeof hideQr === 'function') hideQr(); });
document.getElementById('nmStar').onclick = () => {
  store.starred[nmId] ? delete store.starred[nmId] : store.starred[nmId] = true;
  save(); renderSheet(); render();
};
document.getElementById('nmMore').onclick = e => {
  const d = document.getElementById('nmDesc'); d.classList.toggle('clamp');
  e.target.textContent = d.classList.contains('clamp') ? 'Show more' : 'Show less';
};
function insertAtCursor(text) {
  const { selectionStart: a, selectionEnd: b, value: v } = nmText;
  const atLineStart = a === 0 || v[a - 1] === '\n';
  const ins = (atLineStart ? '' : '\n') + text;
  nmText.setRangeText(ins, a, b, 'end'); nmText.focus(); nmSave();
}
nmText.addEventListener('input', nmSave);
nmText.addEventListener('focus', () => document.getElementById('nmSheet').classList.add('typing'));
nmText.addEventListener('blur', () => document.getElementById('nmSheet').classList.remove('typing'));
// Quick-insert taps shouldn't steal focus from the notes box (avoids the bar flickering in and out)
document.getElementById('nmTools').addEventListener('mousedown', e => e.preventDefault());
document.getElementById('nmClose').onclick = closeNotes;
nm.addEventListener('click', e => { if (e.target === nm) closeNotes(); });
document.getElementById('nmTools').addEventListener('click', e => {
  const b = e.target.closest('[data-ins]'); if (!b) return;
  const k = b.dataset.ins, n = nowPT();
  insertAtCursor(k === 'bullet' ? '- ' : k === 'time' ? `[${fmt(n.min)}] ` : k);
});
nmText.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); closeNotes(); return; }
  if (e.key !== 'Enter' || e.shiftKey) return;
  // Continue "- " and "☐ " lists; Enter on an empty item ends the list
  const { selectionStart: a, value: v } = nmText;
  const line = v.slice(v.lastIndexOf('\n', a - 1) + 1, a);
  const m = /^(\s*(?:[-•*]|☐|☑)\s)/.exec(line);
  if (!m) return;
  e.preventDefault();
  if (line === m[1]) nmText.setRangeText('', a - line.length, a, 'end');
  else nmText.setRangeText('\n' + m[1].replace('☑', '☐'), a, a, 'end');
  nmSave();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && nm.classList.contains('show')) closeNotes(); });

// --- Notes export (Markdown): planned sessions + anything with notes, by day and time
function notesMarkdown() {
  const out = ['# The AI Conference 2026 — my notes', '', `_Exported ${new Date().toLocaleString()}_`, ''];
  DAYS.forEach(d => {
    const items = allSessions().filter(s => s.date === d.key && (s.own || store.starred[s.id] || store.notes[s.id]));
    if (!items.length) return;
    out.push(`## ${d.label}`, '');
    items.forEach(s => {
      out.push(`### ${fmt(s.s)} — ${s.title}`);
      const sp = s.speakers.map(p => p.name + (p.organization ? ` (${p.organization})` : '')).join(', ');
      out.push(`_${[s.room, s.own ? '' : s.track, sp].filter(Boolean).join(' · ')}_`, '');
      out.push(store.notes[s.id] ? store.notes[s.id].trim() : '_No notes._', '');
    });
  });
  return out.join('\n');
}
function toast(msg) {
  const el = Object.assign(document.createElement('div'), { className: 'toast', textContent: msg });
  document.body.append(el); setTimeout(() => el.remove(), 1800);
}
document.getElementById('notesMd').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([notesMarkdown()], { type: 'text/markdown' }));
  a.download = 'aiconf2026-notes.md'; a.click();
};
document.getElementById('notesCopy').onclick = async () => {
  try { await navigator.clipboard.writeText(notesMarkdown()); toast('Notes copied ✓'); }
  catch { toast('Copy failed — use Download instead'); }
};

// --- QR contact card (generated in-page, works offline)
qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];
function qrSvg(text) {
  const q = qrcode(0, 'M'); q.addData(text); q.make();
  const n = q.getModuleCount(), pad = 2;
  let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c + pad} ${r + pad}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n + pad * 2} ${n + pad * 2}" shape-rendering="crispEdges"><path d="${d}" fill="#1d1c22"/></svg>`;
}
function renderCard() {
  const c = store.card;
  try { document.getElementById('qrCode').innerHTML = qrSvg(c.url); }
  catch { document.getElementById('qrCode').innerHTML = '<div class="err">Link is too long for a QR code</div>'; }
  document.getElementById('qrName').textContent = c.name;
  document.getElementById('qrSub').textContent = c.sub;
  const a = document.getElementById('qrUrl'); a.href = c.url; a.textContent = c.url.replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, '');
}
const qr = document.getElementById('qr'), qrCard = document.getElementById('qrCard'), qrForm = document.getElementById('qrForm');
const openQr = () => { renderCard(); qrCard.classList.remove('editing'); qr.classList.add('show'); history.pushState({ qr: 1 }, ''); };
function hideQr() { qr.classList.remove('show'); if (location.hash === '#qr') history.replaceState(history.state, '', location.pathname + location.search); }
const closeQr = () => { if (!qr.classList.contains('show')) return; if (history.state && history.state.qr) history.back(); else hideQr(); };
document.getElementById('qrOpen').onclick = openQr;
document.getElementById('qrClose').onclick = closeQr;
qr.onclick = e => { if (e.target === qr) closeQr(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && qr.classList.contains('show')) closeQr(); });
document.getElementById('qrEdit').onclick = () => {
  Object.entries(store.card).forEach(([k, v]) => { if (qrForm.elements[k]) qrForm.elements[k].value = v; });
  qrCard.classList.add('editing'); qrForm.elements.url.focus();
};
document.getElementById('qrCancel').onclick = () => qrCard.classList.remove('editing');
qrForm.onsubmit = e => {
  e.preventDefault();
  const f = new FormData(qrForm);
  store.card = { url: f.get('url').trim(), name: f.get('name').trim(), sub: f.get('sub').trim() };
  save(); renderCard(); qrCard.classList.remove('editing');
};
if (location.hash === '#qr') openQr(); // bookmarkable: planner.html#qr

// Default to today's tab during the conference, and refresh the "now" marker every minute.
const todayDay = DAYS.find(d => d.iso === nowPT().iso);
if (todayDay) store.day = todayDay.key;
// --- Up next: what's live now and what's next in my plan, with countdown
const until = m => m < 60 ? `${m} min` : `${Math.floor(m / 60)} h${m % 60 ? ` ${m % 60} min` : ''}`;
function renderUpNext() {
  const box = document.getElementById('upnext');
  const now = nowPT(), day = DAYS.find(d => d.iso === now.iso);
  const today = day ? allSessions().filter(s => s.date === day.key) : [];
  const upcoming = today.filter(s => s.e > now.min);
  if (!upcoming.length) { box.classList.remove('show'); setHdr(); return; }
  const mine = upcoming.filter(s => s.own || store.starred[s.id]);
  const live = mine.filter(s => s.s <= now.min);
  const nextStart = Math.min(...mine.filter(s => s.s > now.min).map(s => s.s));
  const next = mine.filter(s => s.s === nextStart);
  const item = (s, isLive, also) => {
    const left = isLive ? s.e - now.min : s.s - now.min;
    return `<button class="un ${!isLive && left <= 5 ? 'soon' : ''}" data-go="${esc(s.id)}" style="--c:${TRACK_COLORS[s.track] || 'var(--accent)'};--on-c:${TRACK_ON[s.track] || '#fff'}">
      <span class="lbl">${isLive ? '● NOW' : 'NEXT'}</span>
      <span class="txt"><div class="ttl">${esc(s.title)}</div>
        <div class="sub"><b>${esc(s.room || '—')}</b> · ${fmt(s.s)}–${fmt(s.e)}${also ? ` · <span class="warn">+${also} overlapping</span>` : ''}</div></span>
      <span class="when">${isLive ? `ends in ${until(left)}` : left <= 0 ? 'starting' : `in ${until(left)}`}</span></button>`;
  };
  let html = live.slice(0, 1).map(s => item(s, true, live.length - 1)).join('')
    + next.slice(0, 1).map(s => item(s, false, next.length - 1)).join('');
  if (!html) { // nothing (more) planned today: hint at the next slot overall
    const ns = Math.min(...upcoming.filter(s => s.s > now.min).map(s => s.s));
    const n = upcoming.filter(s => s.s === ns).length;
    const plannedToday = today.some(s => s.own || store.starred[s.id]);
    html = `<div class="un idle"><span class="lbl">NEXT</span><span class="txt">
      <div class="ttl">${isFinite(ns) ? `${n} session${n > 1 ? 's' : ''} at ${fmt(ns)}` : 'Last sessions in progress'}</div>
      <div class="sub">Nothing ${plannedToday ? 'more ' : ''}planned for today — star ☆ something</div></span>
      ${isFinite(ns) ? `<span class="when">in ${until(ns - now.min)}</span>` : ''}</div>`;
  }
  box.innerHTML = html;
  box.classList.add('show');
  setHdr();
}
function setHdr() { document.documentElement.style.setProperty('--hdr', document.querySelector('header').offsetHeight + 8 + 'px'); }
document.getElementById('upnext').addEventListener('click', e => {
  const b = e.target.closest('[data-go]'); if (!b) return;
  const day = DAYS.find(d => d.iso === nowPT().iso);
  store.day = day.key; store.view = 'plan'; save(); render();
  const el = document.querySelector(`.card[data-id="${CSS.escape(b.dataset.go)}"]`);
  if (el) { el.closest('.slot').scrollIntoView({ block: 'start' }); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1700); }
});

render();

// On load during the conference: jump to the slot happening now (or the next one coming up).
function scrollToNow() {
  const now = nowPT();
  if (!DAYS.some(d => d.iso === now.iso && d.key === store.day)) return;
  const slots = [...document.querySelectorAll('.slot')];
  const target = slots.find(el => now.min < +el.dataset.e && +el.dataset.s <= now.min)
    || slots.find(el => +el.dataset.s > now.min);
  setHdr();
  if (target) target.scrollIntoView({ block: 'start' });
  else scrollTo(0, document.body.scrollHeight); // day is over
}
history.scrollRestoration = 'manual'; // otherwise reload restores the old position instead
scrollToNow();
// Refresh every 30s; while typing only update the bar, so the note/search being edited isn't re-rendered away
setInterval(() => document.activeElement.matches('textarea, input') ? renderUpNext() : render(), 30000);

// Installed-app mode (site/ build served over https): cache everything for offline use
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('./sw.js');
</script>
</body>
