0, 2026","start":"1:15 PM PT","end":"1:25 PM PT","title":"Why the AI You Love Can't Touch Your Data (Yet)","track":"Lunch Lightning Talk","room":"Theater 3","description":"You've felt it. You sit down with a frontier AI and watch it do something genuinely brilliant. So why isn't that capability showing up in your work? Two reasons: you can't hand company and customer data to a chat window, and your business isn't a chat. It's thousands of repeatable, auditable interactions a day, and nothing about raw model access makes those reliable, private, or provable. That gap is why an estimated 95% of enterprise AI pilots never reach production. At SS&C, we hit this wall at scale, processing billions of tokens a month across a regulated, global business, and had to build the layer that closes it: guardrails, monitoring, and auditing between the model and the work. In ten minutes, we'll show you what that layer looks like, why every organization needs one, and what changes when it exists.","speakers":[{"name":"Dave Sergeant","role":"Senior Solutions Consultant","organization":"SS&C Blue Prism"}]},{"id":"c5b1d25c-28cb-4da9-8d12-889f397f5374","date":"September 30, 2026","start":"1:15 PM PT","end":"1:25 PM PT","title":"Actions speak louder than prompts: governing what AI agents actually do","track":"Lunch Mainstage Talk","room":"Theater 1","description":"Everyone is watching what goes into AI agents. Almost no one is watching what they actually do.\nThe industry obsesses over the inbound boundary — prompt injection, guardrails, model alignment — while the real risk lands on the other side: the commands an agent runs, the data it moves, the credentials it reaches for, the systems it changes. An agent doesn't need to be jailbroken to cause damage; it just needs to be helpful in the wrong direction.\nExisting controls can't see this. Every tool in the security stack — secrets managers, DLP, identity, endpoint — watches a boundary: a vault checkout, a network egress, a login. Agents do their work, and their damage, in the space between those boundaries, where every action looks routine and the only identity in sight is a trusted human's. Prompts are too fuzzy to be controls; audit trails are precise but after the fact. Neither answers the question that matters: should this action happen, right now, in this context?\nThis talk makes the case for a new layer: understanding each action an agent is about to take — what will run, what it will touch, and why — and evaluating it before it executes. I'll share real patterns of risky agent behavior from enterprise environments that are invisible to today's tooling.\nWhether you're enabling AI or governing it, you'll leave with a practical framework for the action layer — and the questions your current stack can't answer.","speakers":[{"name":"Nathan Wallace","role":"Founder and CEO","organization":"Turbot"}]},{"id":"10024240-ea90-442a-b87a-9e8170ab413c","date":"September 30, 2026","start":"1:30 PM PT","end":"1:55 PM PT","title":"Moving Confidential Computing up the Stack: Taking AI Security from Theory into Practice","track":"Lunch Breakout Session","room":"Theater 5","description":"Confidential computing has reached AI, but mostly as a point solution for inference. As technology matures, each layer of the AI lifecycle – training, fine-tuning, reinforcement learning, and multi-party workloads – needs attested enclaves at scale.  We present a blueprint and a reference implementation: Kubernetes-orchestrated Confidential Containers, auto-scaling attested GPU enclaves, and an attestation-bound key exchange that keeps sole key custody with the data owner.\n\nThree Key Takeaways\n1. Confidential computing is the foundation of data sovereignty. Moving beyond just inference, all AI training and inference workloads require zero-trust built directly into the compute level. This ensures that data in use is fully accounted for in security, extending protection across the entire ML lifecycle—including pre-training, fine-tuning, and multi-party training on regulated corpora—so that every stage relies on attested, verifiable workloads.\n\n2. Standard deployment workflows must be supported. Manual, per-node attestation by engineers is neither scalable nor how enterprise customers manage their workloads. Deployment workflows must remain consistent with existing standards, while being augmented to support attested TEE deployment at scale. Using Kubernetes with Confidential Containers allows existing deployments to be retrofitted with minimal effort but still providing a trusted way of attesting at scale.\n\n3. Scalability must not compromise data sovereignty. While high-scale deployment is essential, it shouldn’t require delegating key management to a third party. To maintain the integrity of trusted enclaves, the data owner must retain sole custody of encryption keys throughout the lifecycle. True confidential infrastructure achieves scale by offloading operations to the platform, while the owner controls the key release chain from end to end, ensuring the platform only ever handles ciphertext.","speakers":[{"name":"Sachin Nene","role":"Head of R&D","organization":"Corvex"}]},{"id":"86c883c5-fe72-4f9b-8b1b-b2205b120735","date":"September 30, 2026","start":"1:30 PM PT","end":"1:55 PM PT","title":"What most AI gateways and goldfish have in common","track":"Lunch Breakout Session","room":"Theater 4","description":"Enterprise AI leaders and analysts now largely agree that data connectivity and context drive agent trust and accuracy. Catalogs, ontologies, semantic layers, and context repositories put meaning in a layer beside the data, and let the agent ask it. The question now has become: should this layer sit next to or within your AI gateway infrastructure?\n \nA layer outside the request path introduces two challenges. First, it delegates all policy and permission enforcement to the gateway itself, often resulting in broad-based data access. Second, it can only answer a question with the user-provided context, and like a goldfish it forgets the question and the context as soon as it routs it.\n \nA layer inside the gateway sees and learns from the question, the cross-source relationships, the data that came back, and whether the answer survived contact with the user. It enables users and agents to confidently run both deterministic AI workflows and non-deterministic analytical queries, while unlocking a host of read-write use cases that have previously been shelved for security concerns.\n \nThis breakout session explores the benefits and tradeoffs of this critical architectural decision, as well as the cross-system gateway capabilities that not only manage but actively reduce token spend, drive agent accuracy, and unlock previously shelved use cases across enterprise deployments.","speakers":[{"name":"Raviv Levi","role":"Chief Product & Technology Officer","organization":"CData Software"}]},{"id":"3da0822f-2199-4dba-a154-95e89b01ead9","date":"September 30, 2026","start":"1:30 PM PT","end":"1:55 PM PT","title":"What We Learned by Analyzing 1M AI-Generated PRs","track":"Lunch Breakout Session","room":"Theater 2","description":"Background coding agents are quickly moving from novelty to real-world software development workflows. Based on Greptile's analysis of millions of pull requests across 65,000 organizations, this talk explores how often end-to-end AI-generated PRs are being used and how their quality compares to human-written code. The data shows detectable agent-generated PRs grew from under 1% in February 2025 to 27.6% in April 2026, with early quality signals like revert rates and code churn suggesting these agents may already be competitive in serious codebases.","speakers":[{"name":"Daksh Gupta","role":"Co-founder and CEO","organization":"Greptile"}]},{"id":"413ba0be-6c6f-4846-ac87-538d87942b86","date":"September 30, 2026","start":"1:30 PM PT","end":"1:40 PM PT","title":"Five lessons from building an open-source managed agents runtime","track":"Lunch Lightning Talk","room":"Theater 3","description":"Most agent tooling optimizes the agent loop. In production, that is almost never what breaks.\n\nWe built a managed agents runtime — the layer between an agent framework and the infrastructure it actually runs on. Five lessons from that, across the three problems nobody demos: building agents that outlive your framework choice, running them so they survive failure, and governing what they can spend, touch, and see.","speakers":[{"name":"Sijie Guo","role":"CEO","organization":"StreamNative"}]},{"id":"0c4d3811-7bd8-47ce-8cc4-ea5b45dac341","date":"September 30, 2026","start":"1:30 PM PT","end":"1:40 PM PT","title":"From AI-Assisted to AI-Native in 12 Months","track":"Lunch Mainstage Talk","room":"Theater 1","description":"What does it actually take to go all-in on AI as an engineering organization? This session traces monday.com's 12-month journey through three levels of AI engineering: developers pair-programming with AI, builders working in agentic mode, and finally autonomous agents owning complete tasks end-to-end. Anya shares the real metrics behind the shift - from +14% developer throughput at Level 1 to autonomous agents now owning 45% of all merged PRs, with overall output more than doubling. You'll see what this looks like in practice, with agents operating as genuine team members across code review, incident triage, and performance analysis. And you'll hear where monday.com is headed next: optimizing the human-agent team as a single unit.","speakers":[{"name":"Anya Tchernishov","role":"Engineer","organization":"Monday.com"}]},{"id":"642753f2-3e6a-4734-92e9-50b183dce860","date":"September 30, 2026","start":"1:45 PM PT","end":"1:55 PM PT","title":"How to win the battle for the user in the agentic age","track":"Lunch Lightning Talk","room":"Theater 3","description":"The AI era looks like a fight over models, chips, and compute. The real fight is over the user. Whoever delivers the best experience wins the market, and agents are now the front line of that experience.\n\nMost agents are losing it. They launch blind to the people they serve and miss the moments that decide whether a user stays or leaves. The gap between shipping an agent and shipping one people actually rely on is product context: the behavioral and business signals that tell an agent when to step in, what to say, and whether it worked.\n\nThis talk makes the case that the companies who win the age of AI won't be the ones with the most agents. They'll be the ones whose agents truly understand the user, and shows what it takes to build them.","speakers":[{"name":"Arif Poonawala","role":"VP, Product Management","organization":"Pendo"}]},{"id":"8eeae9a1-4532-4dcd-b280-c485aa5b0776","date":"September 30, 2026","start":"1:45 PM PT","end":"1:55 PM PT","title":"No Agentic Sovereignty, No Agentic Security","track":"Lunch Mainstage Talk","room":"Theater 1","description":"For high-security organizations like government, finance, defense, and regulated industries, failing to secure agents isn’t just inconvenient. It’s catastrophic: stalled payments, delayed medical treatments, and dead power grids. More than 70% of regulated-industry leaders name security and privacy as their top barrier to adoption. \nAgents break the assumptions these industries were built on. Unlike deterministic software, they take actions on their own, reach into live systems, and act with privilege no one formally provisioned. The autonomy is the value. Where it acts, and on whose authority, is the exposure. \nThe instinct is to bolt on data residency and call it solved. It isn't. Data sitting in a database is one thing; data an agent picks up, reasons over, and acts on is another—and that motion is where sovereignty actually breaks.\nIn this session, we’ll detail why regulated industries need truly sovereign solutions to support agents in the environments where they run. We'll examine why data residency alone isn't enough, and unpack the risks across every sovereignty control point an agent touches—data, infrastructure, decision, and ecosystem\nAttendees will leave understanding the high-risk actions agents can take on their behalf, why probabilistic guardrails satisfy none of these dimensions, and what high-assurance controls — spanning identity, infrastructure, and decision authority—regulated industries actually need before they let agents act. \nOrganizations that treat this as a continuous, auditable posture will be the ones who move fast in AI adoption and still pass the audit.","speakers":[{"name":"Nandini V.","role":"Principal Product Manager","organization":"RSA Security"}]},{"id":"1a01cd02-edcb-415e-bb3c-052bc39707fd","date":"September 30, 2026","start":"2:00 PM PT","end":"2:25 PM PT","title":"Context Engineering for AI Agents: A Practical Architecture for Production Systems","track":"AI Builders","room":"Theater 2","description":"As AI agents move from demos into production, many teams discover that a more powerful model does not automatically produce better results. The real challenge is often context: giving the agent the right information, at the right time, in the right form.\nThis session shares lessons learned from building and scaling Incident Manager Assist, an enterprise multi-agent system designed to support complex incident investigations. As adoption grew and more enterprise data was connected, we encountered recurring problems: too much information overwhelmed the model, long-running investigations lost important decisions, answers were not tailored to the user, operational data became stale, and expensive models were used even for simple tasks.\nThese challenges led us to six practical context engineering patterns: model-driven control flow, scoped context assembly, intent-driven layered memory, user-aware context, task-adaptive model routing, and continuous context. \nAttendees will leave with a clear way to think about context, and practical patterns for making context-aware agents reliable in production.","speakers":[{"name":"Bhavin Parikh","role":"Senior Principal Architect","organization":"Comcast"}]},{"id":"9d53e203-c0b0-472d-b05c-2f9ab90d048a","date":"September 30, 2026","start":"2:00 PM PT","end":"2:25 PM PT","title":"Why Are We Still Governing AI Like Software?","track":"AI Frontiers","room":"Theater 1","description":"The biggest mistake we may be making with AI agents is treating them like software.\nOrganizations have faced this problem before: how do you delegate real authority without giving up control?\nThe answer may already exist in a place few AI teams are looking.","speakers":[{"name":"Tim Tyler","role":"Head of Industry Engagement","organization":"Gravitee"}]},{"id":"1f51f367-5104-4e1e-a612-bfac45a2335d","date":"September 30, 2026","start":"2:00 PM PT","end":"2:25 PM PT","title":"One Deployment, Five Capabilities: Building a Production Voice Agent on Edge Compute","track":"AI Strategy","room":"Theater 5","description":"Building a voice agent that answers calls, sends follow-up SMS, and emails a transcript is easy in a hackathon. Shipping it to production with sub-200ms round-trip latency, carrier-grade call quality, and zero vendor finger-pointing is where most projects die.\nThis session walks through taking a voice AI agent from prototype to production on a single platform. The demo deploys a site on edge compute that handles inbound calls with an open-source model, follows up over SMS and email, and runs the entire stack from one CLI command. The talk covers the architecture decisions that matter at production scale: where your model runs relative to your telephony termination, how to handle stateful conversations without a separate orchestration vendor, and why the number of vendors in your stack is the strongest predictor of whether your agent survives contact with real traffic.\nAttendees will see a working deployment built with the Telnyx CLI, learn the framework for evaluating stack complexity, and leave with a repo they can fork.","speakers":[{"name":"Stephen Malito","role":"Director of Solutions Engineering","organization":"Telnyx"}]},{"id":"34f96572-52d9-453d-be9f-c4c4ac39bbd8","date":"September 30, 2026","start":"2:00 PM PT","end":"2:25 PM PT","title":"Your Evals Probably Aren’t Dev-Friendly","track":"Applied AI","room":"Theater 4","description":"Evals are only useful if developers can understand what changed, why it changed and what to do next. Most eval systems reduce AI behavior to a single score, leaving engineers to dig through traces and outputs to figure out what actually changed.\n\nThis talk covers how clear diffing can make eval results more actionable by integrating into developer’s day-to-day workflows and how to make those diffs dead simple for developers to understand. Drawing from my experience building the eval framework for Sentry’s AI products and many years of building developer tooling, I’ll share practical ways to surface these results directly in developer workflows and make evals something engineers can use in their daily work.","speakers":[{"name":"Ryan Brooks","role":"Staff Software Engineer","organization":"Sentry"}]},{"id":"ffc222bd-2ac2-40f6-bb39-c803932f23f7","date":"September 30, 2026","start":"2:00 PM PT","end":"2:25 PM PT","title":"From LLMs to Language Agents: Reinforcement Learning in the Post-Training Era","track":"The AI Stack","room":"Theater 3","description":"Pretraining builds knowledge. Reinforcement learning builds behavior.\n\nAs LLMs move into production systems powering copilots, decision engines, and autonomous workflows post-training with RL has emerged as a critical step in shaping model behavior beyond imitation. This talk presents a practical guide to post-training language agents using reinforcement learning, covering reward modeling, human preference optimization, environment-based feedback, and tool-integrated training loops.\n\nThe talk  will analyze trade-offs between supervised fine-tuning and RL, discuss stability and scaling challenges, and present real-world examples where RL improves reasoning depth, tool reliability, and policy alignment.","speakers":[{"name":"Rucha Apte","role":"GenAI Solutions Architect","organization":"NVIDIA"},{"name":"Annie Surla","role":"Product Research Engineering Manager, Deep Learning","organization":"NVIDIA"}]},{"id":"67637ad4-aa07-475a-bb28-27e2cc026bb2","date":"September 30, 2026","start":"2:30 PM PT","end":"2:55 PM PT","title":"The Agentic Shift: How to Build Products When AI Can Actually Do Things","track":"AI Builders","room":"Theater 2","description":"We've moved from AI that generates answers to AI that takes actions — and it's broken most of our existing product design playbooks. This talk shares concrete lessons from building agentic AI products at Google Labs, including Project Mariner (an autonomous web agent), Opal (chained AI workflows), and Pomelli (AI marketing for SMBs), alongside a personal experiment: orchestrating a team of 14 AI agents for everything from meal planning to publishing a coloring book on Amazon KDP.\n\nThe hard-earned lesson? Agentic products live in a year of tensions — exciting vs. overwhelming, autonomy vs. control, thinking big while shipping fast — and the teams that ship well are the ones who design for these tensions instead of pretending they don't exist.\n\nWhat attendees will take away:\n\n• A risk framework for agent autonomy based on reversibility, blast radius, and risk type (reputational, monetary, legal) — because \"when should the agent ask permission?\" is the central design question and the answer is never one-size-fits-all\n\n• The \"Do It With Me\" vs. \"Do It For Me\" spectrum — a practical model for calibrating how much user involvement any given task should have, with real examples from shipping\n\n• Why designing for imperfection matters more than designing for accuracy — agents are non-deterministic systems, and the winning design principle is humans-in-the-loop as a feature, not a fallback\n\n• Iterative co-discovery: how users and agents think together, and why scope expansion through collaboration is not scope creep — it is the product working as intended\n\n• A proactive design quadrant for finding magic (not Clippy) — when proactive agents feel delightful vs. intrusive, based on task value and user effort\n\nThis talk is grounded in real product work, real failures, and the honest gap between \"AI agent demo\" and \"AI agent daily driver.\" No product pitches — just frameworks and lessons from building at both Google scale and personal scale.","speakers":[{"name":"Jaclyn Konzelmann","role":"Product Director","organization":"Google"}]},{"id":"510d4aac-ccf3-41d8-b90e-477cd304ef64","date":"September 30, 2026","start":"2:30 PM PT","end":"2:55 PM PT","title":"Speed Meets Supervision: The Value of Human Judgement in an Agentic World","track":"AI Frontiers","room":"Theater 1","description":"As enterprise adoption of AI accelerates, organizations may struggle to balance engineering speed with system reliability and human oversight. In this talk, Jennifer Strong and Snap Inc. CIO & SVP of Engineering, Saral Jain, discuss how AI agents can support human employees and explore practical strategies for embedding human intuition, experience, and judgment into every stage of AI implementation.","speakers":[{"name":"Jennifer Strong","role":"Tech Journalist","organization":"SHIFT"},{"name":"Saral Jain","role":"SVP of Engineering and Chief Information Officer","organization":"Snap Inc."}]},{"id":"6f447fc2-58db-4293-84a2-875ee80cecf3","date":"September 30, 2026","start":"2:30 PM PT","end":"2:55 PM PT","title":"Act–Verify–Refine: The Future of Adaptive Investment Agents","track":"AI Strategy","room":"Theater 5","description":"In financial asset management, “good enough” AI introduces significant risk. While Large Language Models (LLMs) can generate market narratives at scale, hallucinations and unverifiable claims limit their use in regulated settings. To address this, Harbor Capital Advisors develops a Multi-Agent Act–Verify–Refine (AVR) framework—a self-correcting, validation-driven architecture designed for reliable, auditable outputs.\n\nWe present how manual investment workflows can be transformed into agentic systems using a closed-loop design. Specialized agents decompose outputs into atomic claims, verify them against structured data sources, and iteratively refine results until they meet predefined standards. We describe the design of validation-centric agent workflows, automated claim verification, and data grounding, along with targeted human-in-the-loop (HITL) interventions that balance expert oversight with scalability.","speakers":[{"name":"Shuen Mei","role":"VP, Director of Software and Data Engineering","organization":"Harbor Capital Advisors"}]},{"id":"8675a9a3-6fa2-4443-ae41-da5db1c62f36","date":"September 30, 2026","start":"2:30 PM PT","end":"2:55 PM PT","title":"8 Ways Production Agents Fail Silently (And the Detection Patterns That Catch Them)","track":"Applied AI","room":"Theater 4","description":"What if your agent is failing right now, and your monitoring has no idea?\nYour dashboards are green. Your APIs are healthy. Your latency is normal. The agent returns a perfectly reasonable answer.\nAnd yet, something is wrong.\nAgentic systems create a new reliability problem: the system can appear healthy while the behavior is quietly degrading. A model can lose important context, take the wrong path, trust bad information, or pass a flawed assumption downstream, all while producing output that looks completely reasonable.\nThe question is no longer just: Is the system running?\nHow do you know the agent is doing what you think it is doing?\nThis talk takes a closer look at the failure patterns that emerge when agents move from demos into real systems, and the engineering discipline needed to catch them before they become expensive incidents.\nYou’ll take away:\nA practical failure model for recognizing how autonomous systems can go wrong without producing a conventional error.\nA sharper way to evaluate agent behavior when uptime, latency, and error rates tell only part of the story.\nConcrete architectural techniques for containing bad reasoning, validating agent behavior, and preventing one weak step from becoming a larger system failure.\nA reliability mindset for agents: designing for evidence, explicit boundaries, and failures that are visible and recoverable.\nBecause the hardest failures to debug are the ones that never look like failures.","speakers":[{"name":"Divya Mahajan","role":"Software Engineer","organization":"Amazon"}]},{"id":"640d92af-e414-4bc6-9a45-66ed180ad5a1","date":"September 30, 2026","start":"2:30 PM PT","end":"2:55 PM PT","title":"Evaluating Open Models on Production Traffic","track":"The AI Stack","room":"Theater 3","description":"Open models now match closed frontier models on quality at a fraction of the cost. Choosing one is the easy part. Running it well is where teams get surprised, usually under sustained load, when behavior that looked fine in evaluation stops holding.\n\nTogether AI serves these models at production scale, across thousands of GPUs and hundreds of millions of requests. Ollama is the front door for developers who use them every day. This session covers both vantage points: what it takes to serve an open model efficiently at volume, and what developers hit once they start building on one. Time for questions at the end.","speakers":[{"name":"Parth Sareen","role":"Member of Technical Staff","organization":"Ollama"},{"name":"Zain Hasan","role":"Staff AI/ML Engineer, DX","organization":"Together AI"}]},{"id":"775d9161-d84b-49ba-8e85-aa45239f98e6","date":"September 30, 2026","start":"3:00 PM PT","end":"3:25 PM PT","title":"Designing Durable Conversation State for AI Agents: Production lessons from building Intuit's A/B testing agent","track":"AI Builders","room":"Theater 2","description":"At Intuit, we run AI agents that help teams create and manage A/B experiments through natural language. These agents operate within a multi-agent system, receiving requests from upstream orchestrators, calling external APIs via tool use, and maintaining stateful conversations across multiple turns.  Getting the agent to work was the easy part. Getting it to survive production, with automated agents sending rapid-fire requests, external APIs with undocumented constraints, and gateway timeouts killing requests mid-execution, was where the real engineering happened.  In this talk, I'll share production patterns we developed from real failures:  1. Field descriptions are your most reliable contract with the LLM. Tool descriptions can be truncated by clients and frameworks. But Pydantic field descriptions become part of the JSON schema. They're never truncated, always reach the LLM, and are used for client-side validation before the call even hits your server. A missing precision constraint on a single field caused our LLM to retry a failing API call 12 times in 48 seconds. Moving the constraint into the field description fixed it in one try. I'll show why \"field first\" is the rule for any tool, whether it's a LangGraph tool, an MCP server, or a raw OpenAI function call.  2. Error message quality determines whether your agent self-corrects or spirals. In the same incident, the LLM received two different errors. One said \"must not contain spaces\" and was fixed in 1 try. The other said \"invalid value 33.33\" with no explanation and was retried 12 times. Same LLM, same tool, same conversation. The only difference was how specific the error was. I'll show how actionable error messages are the cheapest reliability investment you can make.  3. Stateful agents have a hidden failure mode nobody talks about. When a request dies mid-execution (timeout, crash, OOM), your checkpointed state can capture an incomplete conversation that violates the OpenAI tool call contract. Every future request on that thread fails permanently with no recovery path. I'll show exactly how this happens and how to design for self-healing state.  4. Intent classification needs a safety net. We use an LLM to classify user intent and dynamically bind only the relevant tools per turn, reducing the chance of the LLM calling the wrong tool entirely. But LLM classification isn't 100% reliable, so we layer heuristic fallbacks underneath. I'll share the dual-layer routing pattern and why limiting tool visibility per turn prevents entire categories of errors.  Each pattern comes from a real production incident. I'll walk through the failures, the wrong assumptions we made during debugging, and the concrete code changes that fixed them.  Key takeaways:  -Put constraints in Pydantic field descriptions, not just tool docstrings. Field descriptions are the only channel guaranteed to reach the LLM untruncated. -Invest in actionable error messages. They're the difference between 1-try self-correction and infinite retry loops. -Design for mid-execution failures in any stateful agent system. Timeouts will corrupt your conversation state. -Layer your intent routing. LLM classification plus heuristic fallbacks.  Target audience: Software engineers, ML engineers, and tech leads building or operating AI agents with tool use in production. The patterns apply regardless of framework (LangGraph, Google ADK, CrewAI, MCP, raw function calling).  Evidence of expertise: I've been selected to speak at the MLOps Community AI Agents Summit (April 2026) on this topic. I've also published on the MCP request lifecycle and tool schema design: https://medium.com/@vidyameenakshi/the-mcp-request-lifecycle-what-actually-happens-when-an-ai-agent-calls-your-tool-57bddc2211ca  Adaptability: I'm happy to receive feedback and adjust the talk to best fit the conference's themes and audience. The content can be tailored for a 20-minute deep dive or a 30-minute session with extended Q&","speakers":[{"name":"Vidya Meenakshi","role":"Senior Software Engineer","organization":"Intuit"}]},{"id":"a35fc4ec-eb44-4d81-89da-89d120cae985","date":"September 30, 2026","start":"3:00 PM PT","end":"3:25 PM PT","title":"AI Transformation Actually Looks Like","track":"AI Frontiers","room":"Theater 1","description":"Everyone says they're \"transforming\" with AI. Few can prove it. This panel puts two operators who actually have receipts in the room — Claire Southey, Chief AI Officer at Rokt, running AI strategy inside a platform processing billions of real-time transactions, and Todd Earwood, CEO of Betra Works, with a track record of ventures built through this exact shift. Moderated by Jason Hiner (The Deep View), expect real examples, real failures, and zero buzzwords.","speakers":[{"name":"Claire Southey","role":"Chief AI Officer","organization":"Rokt"},{"name":"Jason Hiner","role":"Chief Content Officer and Editor-in-Chief","organization":"The Deep View"},{"name":"Todd Earwood","role":"CEO","organization":"Betra Works"}]},{"id":"1232662a-d44d-429f-8bc1-39d4e7aa4c19","date":"September 30, 2026","start":"3:00 PM PT","end":"3:25 PM PT","title":"Cyber Offense Hits Its Moore’s Law Moment - when compute gets cheap, persistence ‎becomes the exploit.‎","track":"AI Strategy","room":"Theater 5","description":"AI is pushing cyber offense into a new regime: when compute and automation become ‎cheap, the attacker’s marginal cost per attempt collapses. The result is not merely ‎‎“better tools,” but a structural change in attacker economics, high-variance, high-‎volume iteration becomes the advantage, and persistence itself starts to function like ‎an exploit. This session presents that shift using real-world signals, including CVE ‎trends and disclosure patterns, bug-bounty reward dynamics, and observed movement ‎in underground markets (pricing, supply, and demand), to explain what is changing and ‎why the implications are durable.‎\nThe talk organizes the transformation into three dominant vectors:‎\n‎1.‎Agentic Attack Orchestration - automation at scale, where planning, chaining, ‎and rapid adaptation become commodity capabilities.‎\n‎2.‎‎ Autonomous Vulnerability Discovery & Exploitation - accelerated discovery of ‎weak seams across complex, fast-changing systems.‎\n‎3.‎‎ AI-Driven Persuasion & Social Engineering  - optimized influence at scale across ‎human and organizational interfaces.‎\nA key question explored is what happens to defense when the adversary can run orders ‎of magnitude more experiments per unit time and cost. In that environment, snapshot ‎assurance, periodic reviews, one-off penetration tests, static checklists, becomes less ‎predictive. The core argument of the session is that red teaming only works at this new ‎tempo when it is operationalized as a continuous measurement and control loop: ‎adversarial scenarios are translated into repeatable security evaluations, those ‎evaluations become regressions that run through change (models, prompts, tools, ‎policies, and integrations), and the resulting signals drive release gates, monitoring, ‎and governance priorities.‎\nThe session is explicitly not a “how to attack” talk. It stays at the architecture, ‎measurement, and governance layer, focusing on defensive design patterns, evaluation ‎approaches, and operationalization rather than exploit instructions. It also draws a hard ‎boundary around what red teaming cannot buy on its own: it cannot compensate for ‎weak authorization design, systemic data exposure, or supply-chain dependencies ‎without complementary controls such as least-privilege boundaries, provenance, and ‎robust telemetry.‎\nFinally, the talk introduces defensive deception as a cross-cutting capability that ‎connects red teaming to day-to-day detection: honeytokens, canary artifacts, and ‎instrumented decoy surfaces that turn attacker-scale automation into high-signal ‎measurements, improving detection fidelity and accelerating containment across all ‎three vectors.‎\nAttendees will leave with (a) a data-informed model of how attacker economics is ‎shifting, (b) a practical blueprint for running AI red teaming as continuous evaluation ‎tied to engineering and governance decisions, and (c) a clear prioritization lens for ‎defensive investment as the other two vectors mature.‎","speakers":[{"name":"Julia Diament","role":"Principal AI Architect, Office of the CTO","organization":"Microsoft"}]},{"id":"879354fd-a323-4c12-8ba7-0bac8b08e8db","date":"September 30, 2026","start":"3:00 PM PT","end":"3:25 PM PT","title":"Lyrics: The Language Model of Music","track":"Applied AI","room":"Theater 4","description":"At Musixmatch — the lyrics database powering Spotify, Apple Music, and most of the streaming ecosystem — we recently shipped lens.musixmatch.com, an AI agent that lets labels and publishers query their catalog as if it were a knowledge base. This talk is about how we built it, what broke, and what the music catalog problem reveals about building production AI on rights-managed, culturally dense corpora.\n\nThe core insight is this: lyrics are music's native language model. For over a century, the music industry has been generating structured semantic data — mood, theme, narrative, entity, temporal context, emotional arc — embedded in song text. Yet metadata extraction in music has historically been restricted to the audio signal: tempo, key, genre, acoustic mood. The lyrical component has been almost entirely ignored as a retrieval and classification surface. That's the gap we closed.\n\nWe built a system with four functional layers. \nThe first is a metadata extraction pipeline that uses LLMs and custom prompt engineering to pull structured information from raw lyrics at scale: themes, ratings, named entities (brands, places, people, events), emotional tone, and cultural references — with entity extraction that understands context rather than relying on string matching, so \"Ford\" in a country song resolves correctly whether it refers to a person, a truck, or a river crossing. \nThe second is a hybrid search index built on OpenSearch, combining dense vector embeddings with structured metadata filters, which allows queries that neither pure semantic search nor keyword search can handle alone — \"find songs about corporate greed appropriate for a retail brand campaign, released after 2018\" requires both.\nThe third layer is where it gets architecturally interesting: a natural language querying system built on an agentic framework we call Domino, where user intent expressed in plain language is decomposed by an LLM into a structured DSQL query via tool calls and in-context learning. The agent doesn't just retrieve — it explains its reasoning, handles ambiguity, and chains multiple retrieval steps when a single query is insufficient. We'll walk through specific failure modes: what happens when cultural context is underspecified, when a user's brief is contradictory, and when the model's knowledge of a cultural reference predates the song that contains it.\nThe fourth layer is trend and classification analysis: using the extracted metadata to map an artist's thematic evolution across albums, identify cultural moments in a catalog (which songs align with an upcoming World Cup, a brand's new campaign, a breaking news cycle), and surface royalty and DSP performance signals alongside content intelligence in a single interface.\n\nThe hardest problems were not model selection. They were: defining what \"derived data\" means as a technical specification when the legal definition didn't previously exist; building evaluation pipelines for tasks where ground truth is cultural and subjective; and designing a retrieval architecture where no raw lyric content ever surfaces in output — a hard licensing constraint that shaped every architectural decision downstream.\n\nAttendees will leave with concrete patterns for building hybrid semantic search on specialized corpora; a practical framework for agentic NLQ systems using tool calls and ICL; honest benchmarks on where general-purpose LLMs degrade on culturally specific data; and a replicable approach to building AI agents on licensed, rights-restricted datasets — a problem that music faces first, but that every regulated domain will face next.","speakers":[{"name":"Marco Paglia","role":"President - Product & Engineering","organization":"Musixmatch"}]},{"id":"63fa38c5-01f7-480d-ac34-7217d6af721d","date":"September 30, 2026","start":"3:00 PM PT","end":"3:25 PM PT","title":"The Content Machine: Orchestrating Content Workflows at Netflix Scale","track":"The AI Stack","room":"Theater 3","description":"Every title that reaches Netflix's millions of subscribers passes through a gauntlet of server-side decisions — and with Netflix's catalog growing faster than ever before, the backend systems powering those decisions have never been under more pressure.\nMost teams solve this by stitching together separate systems for automation, ML, and human review. It works — until it doesn't. At Netflix, we took a different approach: we built a single backend framework where all three are first-class citizens in the same pipeline, sharing the same API contracts, the same failure model, and the same observability story.\nIn this talk, we'll get into the real battle-tested engineering behind it — how we designed microservices that stay stable when components swap out, how we use in-memory data architectures to sidestep the performance ceiling of traditional distributed databases, and how we keep API contracts clean across heterogeneous processing stages. We'll also show how this foundation naturally extends to AI agents — not as a future vision, but as a direct consequence of the architectural decisions we made today.\nExpect concrete patterns, hard-won lessons, and a few surprises from running this in production at Netflix scale.","speakers":[{"name":"Pratyusha Singaraju","role":"Senior Software Engineer","organization":"Netflix"}]},{"id":"5c73322e-6ea7-4547-956b-8546a593c497","date":"September 30, 2026","start":"4:00 PM PT","end":"4:25 PM PT","title":"Why Your AI Keeps Getting It Wrong: The Semantic Backbone Fix","track":"AI Builders","room":"Theater 2","description":"Most enterprise AI failures aren't model failures: they're meaning failures. When LLMs don't share your business's definitions of \"customer,\" \"risk,\" or \"compliant,\" every downstream decision inherits that ambiguity. This session introduces the Semantic Backbone: a knowledge infrastructure that enforces a single, governed semantic agreement across fragmented data silos, grounding LLMs in the business logic that actually matters.\nWe'll show how Semantic GraphRAG architectures reduce hallucinations by up to 90% and make AI reasoning explainable and auditable, without rebuilding your data stack. Data and AI leaders will leave with a concrete framework for moving from brittle prototypes to production-grade, domain-aware AI systems.\nDiagnose why fragmented data definitions are the root cause of most enterprise AI failures in production\nLearn how an enterprise knowledge graph and a context graph play together\nExplore the Semantic Backbone as a governed knowledge infrastructure that enforces unified business logic and context across silos, giving LLMs a reliable foundation to reason from\nExamine how Semantic GraphRAG delivers explainable, auditable AI outputs, and what a practical transition from prototype to production looks like for data leaders","speakers":[{"name":"Rick Crane","role":"Senior Vice President of Revenue (CRO)","organization":"Graphwise"}]},{"id":"d0abe68c-aac2-4889-8b2b-04ccccb23a66","date":"September 30, 2026","start":"4:00 PM PT","end":"4:55 PM PT","title":"Startup Showdown","track":"AI Frontiers","room":"Theater 1","description":"Eight emerging AI startups take the main stage for fast-paced, four-minute pitches in front of active investors and a live audience. With real-time judge scoring and audience voting, founders compete for Top Startup and the People’s Choice Award.","speakers":[{"name":"Brady Forrest","role":"Founder","organization":"Ignite Talks"},{"name":"Emilio Andere","role":"Co-Founder and CEO","organization":"Wafer"},{"name":"Matan Bar-Efrat","role":"Co-founder and CEO","organization":"Rein Security"},{"name":"Maya Gosztyla","role":"Co-Founder and Chief Scientific Officer","organization":"BrainStorm Therapeutics"},{"name":"Akshat Jagga","role":"Founder & CEO","organization":"Datapoint AI"},{"name":"Justin Poehnelt","role":"Founder and CTO","organization":"Helen’s Foundry"},{"name":"Anthony Scodary","role":"Co-founder","organization":"Guava"},{"name":"Sumanyu Sharma","role":"Founder & CEO","organization":"Hamming AI"},{"name":"Zach DeWitt","role":"Partner","organization":"Wing VC"},{"name":"Jason Felger","role":"Operator and Investor","organization":"Jump Capital"},{"name":"Nick Giometti","role":"Senior Principal","organization":"B Capital"}]},{"id":"ce149ad9-5571-4817-bd8c-3f90f075f0d7","date":"September 30, 2026","start":"4:00 PM PT","end":"4:25 PM PT","title":"Beyond Hyperscale: The New Era of Enterprise Infrastructure","track":"AI Strategy","room":"Theater 5","description":"Every application ever built needs to be rebuilt - with agentic AI at the core.  \n\nMoving from cloud-native to ai-native means a new architecture for unlocking enterprise data to safely, securely deliver personalized experiences and services at scale.\n\nAnd delivering business outcomes requires delivering those experiences to employees and customers globally, wherever they live and work.\n\nTo build the Agentic Enterprise, enterprises need to rethink their infrastructure strategy, own their data, and own their AI stack.\n\nIn this session, we’ll explore a new infrastructure approach to unlock enterprise AI - and how agents can help.","speakers":[{"name":"Kevin Cochrane","role":"Chief Marketing Officer","organization":"Vultr"}]},{"id":"52443cac-1bdc-4f75-9daa-ecf52a275d79","date":"September 30, 2026","start":"4:00 PM PT","end":"4:25 PM PT","title":"Every Agent, Everywhere, All at Once","track":"Applied AI","room":"Theater 4","description":"Coding agents are deaf to anything outside their own session, and a LangGraph or CrewAI one has no idea the others exist. Different vendors, different frameworks, different machines none of them share a way to work together. This demo fixes that live: the Claude Code on your laptop, Codex on your colleague's, a LangGraph agent you're running locally, and the OpenClaw on your Mac Studio at home collaborating on the same goal, going back and forth, full-duplex, across every vendor, framework, and machine line at once.","speakers":[{"name":"Vlad Luzin","role":"CTO & Co-founder","organization":"BAND"}]},{"id":"d1ed50da-1189-47d3-b116-ab8393b3dc97","date":"September 30, 2026","start":"4:00 PM PT","end":"4:25 PM PT","title":"Bobium Brawlers: Shipping the First Mobile Game with Fully On-Device Generative AI","track":"The AI Stack","room":"Theater 3","description":"Most AI applications today rely on cloud inference, which introduces latency, privacy concerns, operational cost, and limits real-time interactivity. In games, these constraints are especially problematic: player experiences must respond instantly and scale to millions of users without bankrupting developers.\nIn this talk, we present the architecture and production lessons behind Bobium Brawlers, the first mobile game that runs generative AI entirely on device. The system powers real-time creature and gameplay content generation without a deluge of cloud API calls. \nWe will walk through the design of a production system capable of running generative models locally on consumer devices, including:\nDesigning gameplay systems around local LLM and generative model inference\nTechniques for model compression, optimization, and quality\nIntegrating AI generation directly into core gameplay loops rather than cosmetic features\nHandling latency, guardrails and reliability when inference happens inside the game \nLessons learned from deploying the system to real players and observing emergent gameplay\nWe will also discuss how AI-native design changes traditional game development workflows, including content pipelines, player creativity systems, and balancing mechanics when AI becomes part of the game itself.\nAttendees will walk away with practical insights into shipping AI-first interactive systems on constrained devices, including architectural patterns, optimization strategies, and lessons from deploying generative AI in a live product.","speakers":[{"name":"Piero Molino","role":"CEO","organization":"Studio Atelico"}]},{"id":"f42decf8-ac48-4435-a5dd-c169245ada89","date":"September 30, 2026","start":"4:30 PM PT","end":"4:55 PM PT","title":"Lessons from Building a $100M Product in Six Weeks at OpenAI","track":"AI Builders","room":"Theater 2","description":"Engineering is shifting from synchronous, line-by-line implementation to an asynchronous model in which agents execute, verify, and retry while humans own intent, architecture, constraints, and release decisions.\nDrawing on my experience building OpenAI Ads through Codex from day one and scaling it to more than $100 million in ARR in under six weeks. I’ll show why the advantage does not come from a magic prompt. It comes from the system around the model: persistent workspaces, connections to real engineering tools, reusable skills, objective verification loops, and clear human boundaries around production.\nAttendees will leave with a practical framework for moving faster with coding agents without surrendering engineering judgment or accountability.","speakers":[{"name":"Brian Yang","role":"Member of Technical Staff","organization":"OpenAI"}]},{"id":"14139899-072b-4014-8065-edd1beef48c0","date":"September 30, 2026","start":"4:30 PM PT","end":"4:55 PM PT","title":"One of the Most Complex Thing Humans Build: How AI Is Finally Cracking Chip Design","track":"AI Strategy","room":"Theater 5","description":"Every smartphone, AI accelerator, and data center processor starts as a design problem so complex it defies human intuition. A modern chip contains billions of transistors packed into a space smaller than a fingernail, designed to operate at speeds measured in trillionths of a second, across dozens of operating conditions simultaneously and it has to be right the first time. A single undetected error means scrapping wafers that cost millions of dollars and losing six to twelve months before a corrected chip can be manufactured. There are no patches, no hotfixes, no rollbacks. You tape out, or you do not ship.\n\nThis is the environment where AI is now being deployed and where the gap between what AI promises in a demo and what it delivers under real pressure is most brutally exposed.\n\nThis session examines what it actually takes to move AI from prototype to production in one of the most demanding engineering disciplines on earth, built on production experience designing AI and AR chips at advanced process nodes.\n\nThe first question is where AI delivers genuine value in chip design  and where it does not. AI can predict timing problems before a layout is finalized, flag high-risk areas before they become emergencies, and explore design tradeoffs at a scale no human team could match manually. In the right places, production data shows 15 to 30 percent gains in closure time. But AI also fails quietly in ways more dangerous than obvious failures — and knowing where the boundary sits is as important as knowing the capability exists.\n\nThe second question is what production-ready actually means. In chip design, a tool that requires a new interface or workflow change will not get used under tapeout pressure. Production-ready means invisible: one configuration flag in an existing flow, graceful recovery when compute infrastructure fails, and runtime predictability engineers can rely on when schedules are tight. These are not quality-of-life improvements — they are the entry criteria for adoption.\n\nThe third question is what it costs to keep these systems working after deployment. AI systems in chip design do not stay current on their own. Chip physics change with each new process node. Design tools update and break data pipelines in ways that surface at 2 a.m. during critical runs. Models drift as design styles evolve. Sustaining AI in this environment requires dedicated ownership and organizational alignment — and teams that do not plan for this find their successful prototypes quietly stop working within two or three product cycles.\n\nThe fourth question is how senior practitioners actually evaluate these tools — which is very different from how they perform in a demo. They are not looking for the best benchmark score. They are asking whether they can debug it at midnight, whether it holds up on the hardest late-stage blocks, and whether it fails gracefully or catastrophically when inputs are imperfect.\n\nThe fifth question is what success looks like at scale. When AI works in chip design, senior engineers reach for it by default on the hardest problems, schedules become more predictable, and silicon quality improves without a proportional headcount increase. Organizations that get there treat sustainment and cross-team alignment as first-class investments — not afterthoughts.\n\nAttendees will leave with a framework for evaluating where AI is worth the complexity in their own domain, what commitments separate deployments that scale from those that stall, and how to lead a rigorous conversation about AI ROI that goes beyond slide-deck metrics.","speakers":[]},{"id":"0854897e-3b31-4017-8891-88075d66f4d9","date":"September 30, 2026","start":"4:30 PM PT","end":"4:55 PM PT","title":"When will biology have its ChatGPT moment?","track":"AI Strategy","room":"Theater 5","description":"In life sciences, AI models haven't had an internet's worth of biological data to learn from. We review what's still missing—and what it will take for biology to have its ChatGPT moment.","speakers":[{"name":"Amit Lakhani","role":"Co-founder and CTO","organization":"Onyx"},{"name":"Roger Chen","role":"Co-founder and CEO","organization":"Onyx"}]},{"id":"e98fa806-7984-42d3-8b2f-863444e2b566","date":"September 30, 2026","start":"4:30 PM PT","end":"4:55 PM PT","title":"Deploying LLMs in Production to enhance grocery shopping","track":"Applied AI","room":"Theater 4","description":"This session explores the technical challenges and design patterns behind deploying large language models (LLMs) in real‑world, high‑scale consumer applications. The talk will cover two distinct but related systems: an AI‑driven recipe generation pipeline and a production‑grade LLM‑powered support assistant.\n\nThe recipe generation workflow examines how SEO‑driven keyword inputs are transformed into structured, high‑quality recipes through multi‑stage LLM prompting, retrieval‑based enrichment, and validation steps. It also discusses how image‑generation models are integrated into the pipeline and how quality and consistency are maintained across large content batches.\n\nThe support assistant portion focuses on the architecture and reliability requirements of a large‑scale LLM chatbot serving millions of queries. Topics include context management, retrieval‑augmented responses, multi‑tenant considerations, metadata scoping, error surfaces unique to model providers, and the tracing and observability techniques required to identify and remediate production failures.\n\nAttendees will gain a practical understanding of how LLM systems are built and maintained at scale, how semantic failures differ from traditional software failures, and what architectural patterns can improve accuracy, predictability, and operational reliability in production AI applications.","speakers":[{"name":"Yogiraj Awati","role":"Engineering Manager","organization":"Instacart"}]},{"id":"f162117d-4ca4-4721-9a96-649e02bef8fa","date":"September 30, 2026","start":"4:30 PM PT","end":"4:55 PM PT","title":"Measuring What Matters: Statistical Rigor in AI Accuracy Evaluations","track":"The AI Stack","room":"Theater 3","description":"Most teams evaluate AI accuracy by running a handful of test queries, picking whichever system looks best, and shipping. The problem is that ad-hoc testing doesn't reflect production behavior and isn't replicable; worse, standard benchmarks aren't calibrated to specific use cases. When you're making infrastructure decisions that cost hundreds of thousands of dollars, cherry-picked demos are not a measurement strategy.\n\nThis talk introduces a rigorous framework for evaluating AI search quality that applies classical ML statistical principles to a problem the industry has largely treated as subjective. I’ll cover how to construct a golden test set that actually predicts production performance, how to validate LLMs-as-judge against human raters before trusting them at scale, and how to run controlled comparisons across providers.\n\nThe deeper argument is about what most evaluations get wrong at the measurement level. LLM-based evaluation is inherently stochastic, so the same query, run through the same system, produces different outputs across trials. Reporting accuracy alone can't tell you whether a performance difference is real or just noise; I’ll explain how to decompose evaluation variance into signal and instability. You’ll leave with a methodology you can apply immediately to your own vendor comparisons and internal eval pipelines.","speakers":[{"name":"Zairah Mustahsan","role":"Applied Scientist","organization":"You.com"}]},{"id":"9fd33547-8561-4b0b-9794-ef88244b1bfd","date":"September 30, 2026","start":"5:00 PM PT","end":"7:00 PM PT","title":"Party in the Park","track":"Special Event","room":"The Great Lawn","description":"Party in the Park is an open-air networking celebration bringing the AI community together for an evening of live music, food and drinks, games, and a special surprise announcement. All registered attendees are invited to attend.\n\nSponsored by Fireworks and Merge.","speakers":[]},{"id":"e724e1f6-d72e-4a78-b87b-cd2290ee708c","date":"September 30, 2026","start":"7:00 PM PT","end":"9:00 PM PT","title":"Ignite Talks","track":"AI Frontiers","room":"Theater 1","description":"Ignite Talks is a fast-paced evening of short, high-energy presentations designed to spark new ideas, unexpected conversations, and fresh perspectives. Join fellow attendees for a fun and engaging close to Day 1, featuring a lineup of rapid-fire talks from across the AI community.","speakers":[]},{"id":"790f9d94-7c63-4673-ae3d-146c25d87bf8","date":"October 1, 2026","start":"9:05 AM PT","end":"9:25 AM PT","title":"The Post-Transformer Frontier: More Intelligence per Watt, Token, and Dollar","track":"Keynote","room":"Theater 1","description":"Transformers have reshaped AI, but they were never designed as a foundation for intelligence that must persist and grow over time. Today’s reasoning models often gain capability by generating and accumulating an ever-growing trace of reasoning tokens. This raises latency, drives up inference cost, and increases energy consumption.\nWe are already seeing diminishing returns from scaling parameters and inference-time compute.  This keynote explains why the next frontier in AI will come from architectural breakthroughs that produce more intelligence per watt, token, and dollar.\nI will map the emerging post-Transformer landscape across three architectural frontiers: persistent and recurrent memory, sparse and selective computation, and continual adaptation — and show how they need to come together to achieve this goal.\nI will then introduce BDH — an architecture that unifies memory, reasoning, and adaptation — and lay out a path beyond static parameters and ephemeral token histories toward AI systems that retain what matters, reason and adapt over long horizons, and improve through experience.","speakers":[{"name":"Adrian Kosowski","role":"Chief Scientific Officer and Co-founder","organization":"Pathway"}]},{"id":"43937c13-958a-4a9e-831f-092967f8c28e","date":"October 1, 2026","start":"9:25 AM PT","end":"9:40 AM PT","title":"Your Agent's Next Thousand Tools","track":"Keynote","room":"Theater 1","description":"Every agent framework gives you a loop. What actually matters is what's on the other end of the tool call. In this keynote, Mike Chambers traces the line from software agents to physical ones, same code, same patterns, and shows why the developers who build the next thousand tools will matter more than those who build the next agent framework.","speakers":[{"name":"Mike Chambers","role":"Senior AI specialist DA","organization":"Amazon Web Services"}]},{"id":"27c110ec-102d-432f-84f3-1e271a7c46fc","date":"October 1, 2026","start":"9:40 AM PT","end":"9:55 AM PT","title":"Robot Foundation Models","track":"Keynote","room":"Theater 1","description":"Foundation models have transformed how we interact with AI systems. Can the same transformation take place in robotics, providing us with robots that can be tasked to perform any job through prompts and instructions? Getting the same kind of generality and interactivity out of robots that we've come to expect from AI assistants and generative AI tools will require both technical innovations and a sophisticated industrial effort. In this presentation, I will discuss what robot foundation models are, how they have advanced in recent years, and the technical directions that will lead to the most significant advances in the near future.","speakers":[{"name":"Sergey Levine","role":"Associate Professor","organization":"University of California, Berkeley"}]},{"id":"104dc644-3419-462f-80e2-c44947bc7939","date":"October 1, 2026","start":"9:55 AM PT","end":"10:05 AM PT","title":"Shortlisting and Evaluating Open Models","track":"Keynote","room":"Theater 1","description":"There are dozens of open models worth considering and no reliable way to know which ones suit your workload. General rankings will not tell you, and testing all of them is not realistic. So teams pick a few, run an evaluation, and hope the result means something.\n\nThis session covers how to narrow the field and how to build an evaluation that predicts production behavior. What representative workload data looks like. Which performance characteristics matter before a model goes live. Rochelle works on these migrations across Together AI's customers and will go through what the successful ones did differently.","speakers":[{"name":"Rochelle Mattern","role":"Director, Field Engineering","organization":"Together AI"}]},{"id":"39c541fd-a49b-4833-8692-59d8e97aec72","date":"October 1, 2026","start":"10:05 AM PT","end":"10:20 AM PT","title":"Why We Need User-Owned AI","track":"Keynote","room":"Theater 1","description":"As adoption of AI agents increases, more businesses and individuals are realizing the risk involved in exposing IP, proprietary and financial data, and personal information to centralized AI providers. Illia Polosukhin, co-author of “Attention Is All You Need,” calls for a shift towards “user-owned AI,” or AI systems that optimize for users’ agency and preserve their privacy. He unpacks his vision for an open AI stack and the requirements for more performant and trustworthy AI systems with verifiable compute, globally available to all.","speakers":[{"name":"Illia Polosukhin","role":"Co-Founder","organization":"NEAR AI"}]},{"id":"c2361186-2854-4fc6-be3e-ed621c1902e8","date":"October 1, 2026","start":"10:20 AM PT","end":"10:30 AM PT","title":"Specialized Intelligence with Open Models","track":"Keynote","room":"Theater 1","description":"Rob Ferguson will discuss how organizations figure out their real AI trade-offs: when to post-train, when to keep paying for frontier models, and how to know the difference. The answer comes from eight practices that turn AI from a line item into a competency.","speakers":[{"name":"Rob Ferguson","role":"VP Technology & Strategy","organization":"Fireworks"}]},{"id":"104ad898-1040-48c1-96ae-f05e54ceaccc","date":"October 1, 2026","start":"10:30 AM PT","end":"10:50 AM PT","title":"Reality Is the Final Verifier: On Two Key Gaps in Agentic Software Engineering","track":"Keynote","room":"Theater 1","description":"AI coding agents can generate and test software orders of magnitude faster than humans can. Yet they optimize against requirements and environment models that only approximate stakeholder intent and the real world. This talk introduces the two-gap framework: the requirement gap and the model gap. Neither can generally be closed in an open, changing world. Although these gaps are longstanding, agents make them far more consequential because they may lack relevant context, iterate much faster than humans, and automatically test and deploy implementations. Reliable agentic development therefore requires an outer assurance–revision loop that uses deployment outcomes and human judgment to continually narrow the gaps.","speakers":[{"name":"Ion Stoica","role":"Berkeley Electrical Engineering & Computer Sciences, Professor & Co-founder","organization":"UC Berkeley, Arena, Infarct, and SkyPilot"}]},{"id":"8606134a-2e68-48a6-b631-6097c7a62498","date":"October 1, 2026","start":"11:30 AM PT","end":"11:55 AM PT","title":"When Agents Meet Creativity: What Works and What Breaks","track":"AI Builders","room":"Theater 2","description":"Creativity is a harder domain for agents than task execution because it tests taste, ambiguity, judgment and trust. This talk shares what works, what breaks and what it takes to build agents that genuinely expand human creativity.","speakers":[{"name":"Ran Li","role":"Technical Lead","organization":"Google"}]},{"id":"3ca4816a-c758-4f2a-b6ea-56c4bad219e1","date":"October 1, 2026","start":"11:30 AM PT","end":"11:55 AM PT","title":"Fundraising & the Future of AI Companies","track":"AI Frontiers","room":"Theater 1","description":"In this panel we'll explore where AI capital is actually going, and what investors are underwriting when the underlying technology changes every quarter. We'll dig into how valuations are being justified at the earliest stages, what founders are being asked to prove before a term sheet, where defensibility really comes from when models are a commodity, and what the next 18 months look like for companies raising into this market.","speakers":[{"name":"Lauri Moore","role":"Partner","organization":"Bessemer Venture Partners"},{"name":"Jon Sakoda","role":"Founding Partner","organization":"Decibel"},{"name":"Matthew Strozier","role":"Bureau Chief, WSJ Pro","organization":"The Wall Street Journal"}]},{"id":"75bdd73f-4961-4f8b-a9a6-c137717cc681","date":"October 1, 2026","start":"11:30 AM PT","end":"11:55 AM PT","title":"Why Child Safety Breaks Standard AI Safety, and How We Can Fix it","track":"AI Strategy","room":"Theater 5","description":"Most AI safety operates under a set of strong assumptions. You can collect examples of harmful content to test your classifiers. You can red-team your model to find failure modes. You can hire human reviewers. Concepts that are safe in isolation will be safe when combined. The overall result is what matters; the cost of a single mistake is not that high.\n\nChild safety breaks those assumptions.\n\nChild sexual abuse material is illegal to generate in the US, even for safety testing and research. Standardized evaluation datasets don't exist. Those looking to red-team systems or review user reports face documented psychological harm from exposure. \n\nIn this talk, Michael Simpson, Machine Learning Engineer at Thorn, presents findings from Child Safety Necessitates New Approaches to AI Safety, a collaborative research paper between Thorn and Carnegie Mellon University, outlining 15 open problems across the AI development lifecycle that pose tangible safety risks to the current generation of models. \n\nThe talk is structured around a provocation for AI builders: how can we build systems that provide robust safeguards against extreme harm? The challenges posed here are early signals of a broader class of problems that the field has yet to solve.\n\nThe session covers:\n- Why the technical, legal, and ethical constraints of child safety make standard AI safety approaches fail, and what that reveals about the assumptions baked into current safety research\n- What gaps exist in the current generation of safeguards and best practices\n- Concrete open problems that researchers and AI builders can engage with right now, from generation-free model auditing to robust watermarks to securing AI agents against misuse\n- A call to action for the builders in the room: what responsible AI development looks like when the content category is inherently harmful\n\nAttendees will learn:\n- Why child safety is a stress test for AI safety methodology, not just a policy problem\n\n- A map of 15 specific, real-world open problems across the AI development lifecycle\n\n- The legal, ethical, technical, and wellness constraints that require new ways of thinking about safety\n\n- Specific areas where AI researchers and builders can contribute, from mechanistic interpretability to model hashing to provenance techniques","speakers":[{"name":"Michael Simpson","role":"Staff Data Scientist","organization":"Thorn"}]},{"id":"0dcec03d-f11e-455d-86ba-3a30ef2299f2","date":"October 1, 2026","start":"11:30 AM PT","end":"11:55 AM PT","title":"From 200B Daily Events to Autonomous Agents: It Was Never About the Model","track":"Applied AI","room":"Theater 4","description":"The hardest part of shipping autonomous agents isn't the agent framework - it's everything underneath it.\nIn six months, AppsFlyer went from AI experimentation to a production Agent Platform with 600+ customers running thousands of autonomous marketing agents every week. These agents analyze campaign performance, surface optimization opportunities, and act on recommendations - autonomously, at enterprise scale, across some of the world's largest advertisers. This talk is about what made that velocity possible — and it wasn't the model.\nWe'll walk through how we built a Google Cloud-native AI platform to transform 200B+ raw daily events into governed, discoverable data products. The critical design decision: an intelligent metadata layer that gives agents the semantic context to reason over enterprise data without hallucinating - turning \"data lake\" into \"data products agents can actually use.\"\nYou'll see the specific architectural patterns we used, the governance and design tradeoffs we made to ship fast without losing trust, and the failure modes we hit when agents met messy real-world data. We'll share the patterns that generalize beyond marketing to any domain where agents need to operate safely on complex enterprise data.\n\nThis is a practitioner talk. No slides about what agents could do someday. Just the architecture, decisions, and lessons from scaling autonomous systems in production.","speakers":[{"name":"Inna Weiner","role":"VP Product","organization":"AppsFlyer"}]},{"id":"09d5f252-98dc-4ecb-b040-4b42ff3d5436","date":"October 1, 2026","start":"11:30 AM PT","end":"11:55 AM PT","title":"Behind the Endpoint: Running Production Inference at Scale","track":"The AI Stack","room":"Theater 3","description":"Today’s most ambitious AI products combine multiple models, custom and post-trained models, multimodal workloads, and long-running agents—often under unpredictable demand. At the same time, users still expect them to feel instantaneous, reliable, and economically sustainable.\nDrawing on patterns across AI-native startups and large enterprises, this session will unpack what it takes to run inference well at production scale: matching models to the right engines and hardware, scaling without painful cold starts, managing latency, reliability, and cost tradeoffs, and continuously adapting as models and workloads evolve.\nMore importantly, we will examine how these infrastructure decisions shape the customer experience, and how AI architectures are evolving behind the simplicity of a model endpoint. As inference becomes more central to product differentiation, companies are beginning to treat it not as backend infrastructure, but as a core product capability.","speakers":[{"name":"Sai Maddali","role":"Product Lead","organization":"Baseten"}]},{"id":"af81ed1f-8383-40fc-ac7a-303a4e1c7426","date":"October 1, 2026","start":"12:00 PM PT","end":"12:25 PM PT","title":"Building Agentic AI at PayPal: Platform, Governance, and Agent Design","track":"AI Builders","room":"Theater 2","description":"An agent that can act on production systems is a new actor in the enterprise. It has credentials, and it can accomplish complex tasks across systems autonomously. That changes what the platform underneath has to provide: identity and authorization for non-human actors, transaction-grade reliability, and observability that treats every agent action as a first-class audited event.\nAt PayPal we run a fleet of specialized agents on shared infrastructure — agents that write code, deploy models, and monitor agents. They sit on a common substrate: a certified agent/mcp registry, agent-to-agent delegation, unified model routing under latency and cost pressure, enterprise memory that persists across sessions, and a governed skills layer so capabilities are reused rather than rebuilt. We're now extending that substrate across cloud project boundaries, so agents owned by different teams and deployed in different environments can find and delegate to each other. Once agents cross those boundaries, identity and audit become essential. In regulated financial infrastructure, governance, security, and Responsible AI aren't a layer bolted on, they're the substrate the swarm of agents runs on.\nThis talk walks through that architecture, then gets into the parts that were hard to learn: graph-based orchestration with typed state contracts, how we scaled the agent orchestrator, normalizing two agent protocols into one response contract, human-in-the-loop at the right moments, and agent memory that survives across sessions.\nYou'll leave with patterns you can apply to your own systems and a clearer view of the platform capabilities these systems rely on.","speakers":[{"name":"Hardik Nahata","role":"Senior Machine Learning Engineer","organization":"PayPal"},{"name":"Deepika Khera","role":"AI Platforms & Strategy","organization":"PayPal"}]},{"id":"58ba407a-1343-4448-8ba9-1e524cbd5125","date":"October 1, 2026","start":"12:00 PM PT","end":"12:25 PM PT","title":"Experience Is Abundant. Knowledge Is Distilled.","track":"AI Frontiers","room":"Theater 1","description":"Generative AI gave us an abundance of content. Agentic AI is giving us something potentially more valuable, while also much more overwhelming: experience. Every tool call, coding session, workflow, decision, observation, and robot trajectory leaves behind another trace of what happened, what worked, and what didn't.\n\nBut accumulating raw piles of experience isn't the same as learning from it.\n\nThis talk explores an emerging layer in AI systems devoted not simply to storing context, but to distilling experience into durable, reusable knowledge. We'll connect ideas appearing across agent memory, semantic layers, knowledge bases, coding agents, context graphs, and even physical AI: resolving repeated observations into entities, discovering relationships and patterns, turning trajectories into reusable skills, and feeding what we've learned back into future action.\n\nA number of knowledge primitives are competing for this layer, from the humble Markdown document and hypertext to vector embeddings, model weights, and knowledge graphs. Graphs, in particular, keep popping up. They may occupy a sweet spot: knowledge that is structured yet flexible, explicit and inspectable, portable across models and agent harnesses, and capable of generating other representations without surrendering the underlying structure. We'll pressure-test that claim, asking when the graph is useful, when it isn't, and whether increasingly capable models might eventually swallow the whole thing.\n\nThe last wave of AI was about generation. The next frontier may be about accumulation: building systems that don't just produce more experience, but get better at distilling what it means.","speakers":[{"name":"Jeremy Adams","role":"Senior Developer Advocate","organization":"Neo4j"}]},{"id":"30154f37-66ac-4a37-8238-162814e3b417","date":"October 1, 2026","start":"12:00 PM PT","end":"12:25 PM PT","title":"Beyond the Developer: Architecting the Agentic Commerce Stack of Tomorrow","track":"AI Strategy","room":"Theater 5","description":"The first wave of agentic commerce has arrived and it's almost exclusively built for developers. Autonomous purchasing scripts, AI procurement bots, agent-to-agent negotiation frameworks: today's tooling assumes a technically sophisticated user who can configure APIs, manage credentials, and navigate raw infrastructure. While appropriate for today’s agentic landscape, eCommerce as a whole will need to adapt and evolve for the world of tomorrow.\nJust as developers want to delegate the burden of API key configuration, pay-per-use requests, and more to an AI agent today, the shopper of tomorrow will delegate everyday purchasing decisions to AI agents using simple English commands. This shift demands more than better UX, it requires a protocol stack designed for trust, discoverability, consent, and seamless payment at machine speed.\nThis talk walks the full agentic shopping lifecycle through five converging standards and shows them working together in a live proof-of-concept that settles real value on Hedera testnet: Agent2Agent Protocol (A2A) for agent-to-agent discovery and negotiation; Agent Payments Protocol's (AP2) signed mandates for capturing verifiable purchase authorization; the Legal Context Protocol (LCP) for making terms, governing law, and dispute recourse discoverable and verifiable; Agent Name Service (ANS) for agent identity, so shoppers and merchants know who they're actually dealing with; and x402 over Hedera for programmable stablecoin settlement with enforced spending caps and guardrails on autonomous spend.","speakers":[{"name":"Narbeh Shahnazarian","role":"Senior Solutions Architect","organization":"HashGraph"}]},{"id":"bfeab38c-1fbe-4e9d-a4a9-21861f4b283e","date":"October 1, 2026","start":"12:00 PM PT","end":"12:25 PM PT","title":"The Agentic Product Loop: Why shipping faster has raised the stakes on everything else you do","track":"Applied AI","room":"Theater 4","description":"Every product team is under pressure to \"do AI,\" but most of its benefits to date have centered around product execution, leaving the rest of the product development lifecycle a green field for the next wave of innovation, and increasingly, a strategic imperative. Drawing from the front lines of building Productboard Spark, Hubert Palan makes the case that these other phases have stayed unsolved for a specific reason. Beyond the orderly structure of a repo, agents require a shared, interconnected substrate. Hubert explores the architecture that closes that gap, and what separates the average DIY product agent from one you can bet your roadmap on.\n\nYou'll learn:\n\n- How to tell real decision-quality gains from superficial AI productivity\n- The components of a dependable agentic product system, and why each one is easy to underestimate\n- Why \"build it ourselves\" is harder than it looks, and how to frame build-vs-buy for AI\n- Why loop speed, not shipping speed, is the real competitive advantage","speakers":[{"name":"Hubert Palan","role":"Co-Founder and CEO","organization":"Productboard"}]},{"id":"a9988719-b01d-4941-b88e-19b32f3a98d2","date":"October 1, 2026","start":"12:00 PM PT","end":"12:25 PM PT","title":"Data Architectures in the Age of AI: Rebuilding the data stack from first principals for autonomous agents","track":"The AI Stack","room":"Theater 3","description":"Every major computing shift has reshaped the software stack, but one assumption held across all of them: humans were the primary consumers of software and software-generated artifacts.\nAI agents break this assumption. An autonomous agent determines at runtime what data it needs, interprets it, and takes actions, with no human in the loop to catch misinterpretations. \nIn this new era, bolting AI features onto existing app-centric, or warehouse- and lakehouse-centric stacks just isn't enough to meet the requirements of these agents. The data layer must be rethought from first principles to enable agents to run critical decision-making workflows using structured operational data, reliably and with confidence. \nIn this talk, I’ll discuss three imperative changes – automatically generated and maintained business semantics, federation as the default retrieval path, and governance – and show how our new agent-native data platform incorporates these principles.","speakers":[{"name":"Deepti Srivastava","role":"Founder and CEO","organization":"Snow Leopard AI"}]},{"id":"054d0150-f5c9-4f9d-baf9-6114671a3401","date":"October 1, 2026","start":"12:30 PM PT","end":"12:55 PM PT","title":"AI and Managed Services: Future Models of Symbiosis with AI","track":"Lunch Breakout Session","room":"Theater 5","description":"AI is transforming managed services from a labor-driven model to an intelligence-driven one. As organizations embed AI into service delivery, the focus is shifting toward defining clear roles for human expertise, autonomous systems, and business stakeholders while maintaining accountability and operational excellence. This session will explore emerging frameworks for AI governance, performance measurement, and outcome-based service delivery, with a particular focus on maximizing ROI from AI investments. Attendees will learn how leading enterprises are optimizing model selection, controlling
