<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Conference 2026 — My Planner</title>
<meta name="theme-color" content="#f6f5f8">
<meta name="color-scheme" content="light dark">
<script>
  // Apply saved theme before first paint (auto | light | dark). Also stops Chrome's forced auto-dark from recoloring the page.
  (function () {
    var pref = 'auto'; try { pref = JSON.parse(localStorage.getItem('aiconf2026-planner') || '{}').theme || 'auto'; } catch (e) {}
    var dark = pref === 'dark' || (pref === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  })();
</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
  /* --accent: text/borders; --accent-bg: filled buttons with white text (same in both themes for contrast) */
  :root, :root[data-theme=light] {
    color-scheme: light;
    --bg: #f6f5f8; --card: #fff; --text: #1d1c22; --muted: #62606b; --line: #e3e1e8;
    --accent: #5b3df5; --accent-bg: #5b3df5; --danger: #d6336c; --ok: #2b8a3e; --hint: #d9480f; --keynote: #4c4b52; --star: #f0a500; --on-soft: #fff;
  }
  :root[data-theme=dark] {
    color-scheme: dark;
    --bg: #121116; --card: #1e1c25; --text: #f1f0f5; --muted: #b0adbb; --line: #3a3745;
    --accent: #a597ff; --accent-bg: #5b3df5; --danger: #ff7aa2; --ok: #69db7c; --hint: #ffa94d; --keynote: #c9c6d4; --star: #ffc933; --on-soft: #121116;
  }
  .themebtn { position: absolute; top: 8px; right: 12px; display: flex; align-items: center; gap: 5px; height: 30px; padding: 0 10px;
    border: 1px solid var(--line); background: var(--card); color: var(--muted); border-radius: 999px; cursor: pointer; font-size: 12.5px; }
  .themebtn:hover { color: var(--text); }
  .themebtn svg { width: 15px; height: 15px; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding: 10px 14px; }
  h1 { font-size: 17px; margin: 0 0 8px; padding-right: 88px; }
  h1 small { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 6px; }
  h1 small a { color: var(--accent); text-decoration: none; white-space: nowrap; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 6px; }
  button, input, textarea, select { font: inherit; color: inherit; }
  .seg button, .btn { border: 1px solid var(--line); background: var(--card); padding: 5px 11px; border-radius: 999px; cursor: pointer; }
  .seg button.on { background: var(--accent-bg); border-color: var(--accent-bg); color: #fff; }
  /* Day cards */
  .switcher { display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap; margin-bottom: 8px; }
  #days { display: flex; gap: 8px; }
  .day { position: relative; display: grid; grid-template-columns: auto auto; grid-template-rows: auto auto; column-gap: 10px; align-items: center;
    text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 14px; padding: 7px 14px 7px 12px; cursor: pointer;
    transition: transform .15s, box-shadow .15s, background .2s; }
  .day:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgb(0 0 0 / .08); }
  .day .dn { grid-row: 1 / 3; font-size: 30px; font-weight: 800; line-height: 1; letter-spacing: -1px; }
  .day .dw { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .day .dw i { font-style: normal; }
  .day .dp { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  .day .dp.bad { color: var(--danger); font-weight: 600; }
  .day.on { background: linear-gradient(135deg, #5b3df5, #c2255c); border-color: transparent; color: #fff; box-shadow: 0 6px 18px rgb(91 61 245 / .35); }
  .day.on .dw, .day.on .dp { color: rgb(255 255 255 / .85); }
  .day.on .dp.bad { color: #fff; }
  /* View toggle with sliding thumb */
  #views { position: relative; display: grid; grid-template-columns: 1fr 1fr; align-self: center; margin-left: auto;
    background: var(--line); border-radius: 999px; padding: 3px; }
  #views::before { content: ""; position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px); border-radius: 999px;
    background: var(--card); box-shadow: 0 1px 4px rgb(0 0 0 / .15); transition: transform .25s cubic-bezier(.3,.7,.4,1); }
  #views[data-v=plan]::before { transform: translateX(100%); }
  #views button { position: relative; border: 0; background: none; padding: 6px 14px; border-radius: 999px; cursor: pointer; color: var(--muted); font-weight: 500; white-space: nowrap; }
  #views button.on { color: var(--text); }
  #count { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 3px; border-radius: 999px; background: var(--accent-bg); color: #fff; font-size: 11.5px; line-height: 18px; text-align: center; }
  #count.bad { background: var(--danger); }
  @media (max-width: 560px) { #views { margin-left: 0; width: 100%; } #days { width: 100%; } .day { flex: 1; min-width: 0; padding: 6px 10px; }
    .day .dw i { display: none; } .day .dn { font-size: 26px; } }
  .btn.small { padding: 2px 9px; font-size: 13px; }
  /* Search */
  .findrow { flex-wrap: nowrap; }
  .search { flex: 1; min-width: 44%; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 12px; height: 38px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; transition: border-color .15s, box-shadow .15s; }
  .search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  .search svg { flex: none; color: var(--muted); }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; padding: 0; }
  .search input::-webkit-search-cancel-button { display: none; }
  .search .n { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .search .clear { display: none; border: 0; background: var(--line); width: 22px; height: 22px; border-radius: 50%; cursor: pointer; font-size: 12px; line-height: 1; }
  .search.has .clear { display: block; }
  /* Track filter chips */
  #tracks { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
  /* Track chips: "All" (default) or pick specific tracks. Unselected = neutral, selected = track colour. */
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 6px 4px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 500;
    cursor: pointer; user-select: none; white-space: nowrap; background: var(--card); border: 1px solid var(--line); color: var(--text); transition: all .15s; }
  .chip:hover { border-color: color-mix(in srgb, var(--c) 60%, var(--line)); }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
  .chip .n { font-size: 11px; min-width: 18px; text-align: center; padding: 0 5px; border-radius: 999px; background: var(--bg); color: var(--muted); line-height: 17px; }
  .chip.sel { background: color-mix(in srgb, var(--c) 15%, var(--card)); border-color: color-mix(in srgb, var(--c) 55%, transparent); font-weight: 600; }
  .chip.sel .dot { box-shadow: 0 0 0 2px color-mix(in srgb, var(--c) 30%, transparent); }
  .chip.sel .n { background: var(--c); color: var(--on-c, #fff); }
  .chip.all { padding-left: 12px; }
  .chip.all.sel { background: var(--accent-bg); border-color: var(--accent-bg); color: #fff; }
  .chip.all.sel .n { background: rgb(255 255 255 / .25); color: #fff; }
  .chip.zero:not(.sel) { opacity: .45; }
  body.plan #tracks, body.plan .roomsel { display: none; }
  /* Room filter */
  /* Styled like the search box; the native <select> stays (best picker on phones) but loses its default chrome */
  .roomsel { position: relative; flex: 0 1 auto; min-width: 0; display: flex; align-items: center; gap: 6px; height: 38px; padding: 0 10px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); cursor: pointer; transition: border-color .15s, box-shadow .15s, background .15s; }
  .roomsel.open, .roomsel:has(.roomval:focus-visible) { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  .roomsel > svg { flex: none; width: 15px; height: 15px; }
  .roomval { min-width: 0; flex: 1; border: 0; outline: 0; background: none; padding: 0 20px 0 0; color: var(--text); cursor: pointer; text-align: left;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .roomsel .chev { position: absolute; right: 10px; pointer-events: none; transition: transform .15s; }
  .roomsel.open .chev { transform: rotate(180deg); }
  #roomMenu { position: fixed; z-index: 36; display: none; min-width: 250px; padding: 6px; background: var(--card); color: var(--text);
    border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 14px 36px rgb(0 0 0 / .22); }
  #roomMenu.show { display: block; animation: rmPop .14s ease-out; }
  @keyframes rmPop { from { opacity: 0; transform: translateY(-4px); } }
  .rm-title { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 6px 10px 6px; }
  .ropt { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border: 0; background: none; border-radius: 10px;
    cursor: pointer; text-align: left; font-size: 14.5px; }
  .ropt:hover, .ropt:focus-visible { background: var(--bg); outline: 0; }
  .ropt .rn { flex: 1; min-width: 0; }
  .ropt .rc { font-size: 12px; font-weight: 600; min-width: 28px; text-align: center; padding: 2px 8px; border-radius: 999px; background: var(--bg); color: var(--muted); }
  .ropt .ck { width: 16px; height: 16px; flex: none; color: var(--accent); visibility: hidden; }
  .ropt.sel { background: color-mix(in srgb, var(--accent) 10%, var(--card)); color: var(--accent); font-weight: 600; }
  .ropt.sel .rc { background: var(--accent-bg); color: #fff; }
  .ropt.sel .ck { visibility: visible; }
  .ropt.zero:not(.sel) { opacity: .45; }
  .rm-sep { height: 1px; background: var(--line); margin: 4px 6px; }
  #roomBackdrop { position: fixed; inset: 0; z-index: 35; display: none; }
  #roomBackdrop.show { display: block; }
  @media (max-width: 560px) {
    #roomMenu { left: 0 !important; right: 0 !important; top: auto !important; bottom: 0; min-width: 0; max-height: 75vh; overflow-y: auto;
      border-radius: 20px 20px 0 0; padding: 6px 10px calc(14px + env(safe-area-inset-bottom)); }
    #roomMenu.show { animation: rmUp .22s cubic-bezier(.3,.7,.4,1); }
    #roomMenu::before { content: ""; display: block; width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 4px auto 6px; }
    .ropt { padding: 13px 12px; font-size: 16px; }
    #roomBackdrop.show { background: rgb(10 8 20 / .5); }
  }
  @keyframes rmUp { from { transform: translateY(100%); } }
  .roomsel .rclear { display: none; flex: none; border: 0; background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent);
    width: 22px; height: 22px; border-radius: 50%; cursor: pointer; padding: 0; place-items: center; }
  .roomsel .rclear svg { width: 12px; height: 12px; }
  .roomsel.on { background: color-mix(in srgb, var(--accent) 9%, var(--card)); border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); color: var(--accent); }
  .roomsel.on .roomval { color: var(--accent); font-weight: 600; padding-right: 0; }
  .roomsel.on .chev { display: none; }
  .roomsel.on .rclear { display: grid; }
  @media (max-width: 560px) {
    #tracks { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 8px -14px 0; padding: 0 14px 2px;
      mask-image: linear-gradient(90deg, transparent, #000 14px, #000 calc(100% - 24px), transparent); }
    #tracks::-webkit-scrollbar { display: none; }
  }
  main { max-width: 900px; margin: 0 auto; padding: 10px 14px 60px; }
  .slot { display: grid; grid-template-columns: 78px 1fr; gap: 10px; margin: 14px 0; scroll-margin-top: var(--hdr, 180px); }
  .slot > .t { font-weight: 600; font-size: 13.5px; padding-top: 8px; color: var(--muted); }
  .slot > .t.now { color: var(--accent); }
  .list { display: flex; flex-direction: column; gap: 6px; }
  .card { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--c, #999); border-radius: 8px; padding: 8px 10px; }
  .card.starred { background: color-mix(in srgb, var(--accent) 7%, var(--card)); --sb: color-mix(in srgb, var(--accent) 22%, var(--line)); border-top-color: var(--sb); border-right-color: var(--sb); border-bottom-color: var(--sb); }
  [data-theme=dark] .card.starred { background: color-mix(in srgb, var(--accent) 11%, var(--card)); }
  /* Up next bar */
  #upnext { display: none; gap: 8px; margin: 0 0 8px; }
  #upnext.show { display: flex; flex-wrap: wrap; }
  .un { flex: 1 1 260px; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 7px 12px; cursor: pointer; text-align: left;
    background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--c, var(--accent)); border-radius: 12px; }
  .un:hover { border-color: var(--c, var(--accent)); }
  .un .lbl { flex: none; font-size: 10.5px; font-weight: 800; letter-spacing: .08em; padding: 3px 7px; border-radius: 6px; background: var(--c, var(--accent)); color: var(--on-c, #fff); }
  .un .txt { min-width: 0; flex: 1; }
  .un .ttl { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .un .sub { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .un .sub b { color: var(--text); }
  .un .when { flex: none; font-weight: 700; font-size: 13px; white-space: nowrap; }
  .un.soon { background: color-mix(in srgb, var(--c, var(--accent)) 12%, var(--card)); }
  .un.soon .when { color: var(--danger); animation: pulse 1.4s ease-in-out infinite; }
  .un.idle { cursor: default; color: var(--muted); }
  @keyframes pulse { 50% { opacity: .35; } }
  .card.flash { animation: flash 1.6s ease-out; }
  @keyframes flash { 0%, 30% { box-shadow: inset 0 0 0 3px var(--accent); } }
  .card.conflict { box-shadow: inset 0 0 0 2px var(--danger); background: color-mix(in srgb, var(--danger) 8%, var(--card)); }
  .card.clashhint { opacity: .6; }
  [data-theme=dark] .card.clashhint { opacity: .72; }
  .hint { font-size: 12.5px; color: var(--hint); }
  .card .top { display: flex; gap: 8px; align-items: flex-start; }
  .card .main { flex: 1; min-width: 0; }
  .card .title { font-weight: 600; }
  .meta { font-size: 12.5px; color: var(--muted); }
  .meta b { color: var(--text); font-weight: 500; }
  .star { background: none; border: none; font-size: 22px; line-height: 1; cursor: pointer; color: var(--muted); padding: 0 2px; }
  .star.on { color: var(--star); }
  .card { cursor: pointer; transition: border-color .15s; }
  .card:hover { border-color: color-mix(in srgb, var(--c, #999) 60%, var(--line)); }
  .side { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .hasnote { color: var(--accent); display: grid; place-items: center; }
  .note { display: none; font-size: 13px; white-space: pre-line; margin-top: 6px; } /* printed only */
  /* Notes modal */
  body.modal-open { overflow: hidden; }
  #nm { position: fixed; inset: 0; z-index: 40; display: none; padding: 24px; background: rgb(10 8 20 / .6); backdrop-filter: blur(3px); }
  #nm.show { display: flex; align-items: center; justify-content: center; }
  .sheet { width: min(720px, 100%); max-height: min(90vh, 900px); display: flex; flex-direction: column;
    background: var(--card); border-radius: 18px; box-shadow: 0 20px 60px rgb(0 0 0 / .4); border-top: 5px solid var(--c, var(--accent)); overflow: hidden; }
  /* Header grid: track + position and nav buttons on row 1, full-width title on row 2 */
  .nm-head { display: grid; grid-template-columns: 1fr auto; column-gap: 12px; row-gap: 6px; align-items: center; padding: 12px 16px 12px; border-bottom: 1px solid var(--line); }
  .nm-head > div:first-child { display: contents; }
  .nm-kicker { grid-row: 1; grid-column: 1; min-width: 0; font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--c, var(--accent)); }
  .nm-head .nm-nav { grid-row: 1; grid-column: 2; }
  .nm-title { grid-row: 2; grid-column: 1 / -1; font-weight: 700; font-size: 18px; line-height: 1.3; }
  .nm-x { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); cursor: pointer; font-size: 15px;
    display: grid; place-items: center; padding: 0; }
  .nm-x svg { width: 18px; height: 18px; }
  .nm-nav { flex: none; display: flex; gap: 6px; }
  .nm-pos { color: var(--muted); font-weight: 600; letter-spacing: 0; text-transform: none; margin-left: 6px; }
  .nm-body.in-l { animation: inL .22s ease-out; }
  .nm-body.in-r { animation: inR .22s ease-out; }
  @keyframes inL { from { opacity: 0; transform: translateX(28px); } }
  @keyframes inR { from { opacity: 0; transform: translateX(-28px); } }
  .nm-body { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 12px; overscroll-behavior: contain; }
  .nm-body > * { flex-shrink: 0; } /* scroll instead of squashing the description */
  .nm-when { font-size: 14px; }
  .nm-when b { font-weight: 600; }
  .nm-star { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 999px; cursor: pointer; font-weight: 600;
    border: 1.5px solid var(--line); background: var(--bg); }
  .nm-star.on { border-color: var(--star); color: var(--text); background: color-mix(in srgb, var(--star) 14%, var(--card)); }
  .nm-star .s { color: var(--star); font-size: 17px; line-height: 1; }
  .nm-spk { display: flex; flex-direction: column; gap: 3px; font-size: 14px; }
  .nm-spk span { color: var(--muted); }
  .nm-desc { white-space: pre-line; font-size: 14.5px; line-height: 1.55; margin: 0; }
  .nm-desc.clamp { display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
  .nm-more { align-self: flex-start; border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; font-weight: 600; margin-top: -6px; }
  .nm-notes { border-top: 1px dashed var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
  .nm-sec { display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; }
  .nm-sec small { font-weight: 400; font-size: 12px; color: var(--muted); }
  .nm-sec .ok { color: var(--ok); }
  .nm-tools { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: none; }
  .nm-tools button { flex: none; border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 4px 11px; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .nm-tools button:hover { border-color: var(--accent); }
  #nmText { width: 100%; min-height: 170px; resize: none; overflow: hidden; border: 1px solid var(--line); border-radius: 12px; background: var(--bg);
    padding: 12px 14px; font-size: 16px; line-height: 1.6; outline: 0; }
  #nmText:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent); }
  .nm-keys { font-size: 12px; color: var(--muted); }
  .nm-bar { flex: none; display: flex; gap: 8px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--card); }
  .nm-step { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 1px; text-align: left; padding: 7px 12px; cursor: pointer;
    border: 1px solid var(--line); background: var(--bg); border-radius: 12px; }
  .nm-step.next { text-align: right; }
  .nm-step:hover:not(:disabled) { border-color: var(--accent); }
  .nm-step:disabled { visibility: hidden; }
  .nm-step .lab { font-size: 11.5px; font-weight: 700; color: var(--accent); white-space: nowrap; }
  .nm-step .tt { font-size: 13px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .sheet.typing .nm-bar { display: none; } /* give the keyboard room while writing notes */
  @media (max-width: 560px) {
    #nm { padding: 0; }
    .sheet { width: 100%; height: 100dvh; max-height: none; border-radius: 0; }
    .nm-keys { display: none; }
  }
  .toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); z-index: 50; background: #1d1c22; color: #fff; padding: 8px 16px; border-radius: 999px; font-size: 14px; }
  .gap { font-size: 12.5px; color: var(--ok); margin: 4px 0 4px 88px; }
  .warn { color: var(--danger); font-size: 12.5px; font-weight: 600; }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
  .addform { background: var(--card); border: 1px dashed var(--line); border-radius: 8px; padding: 10px; margin: 12px 0; display: none; gap: 6px; flex-wrap: wrap; }
  .addform.show { display: flex; }
  .addform input { padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
  .foot { color: var(--muted); font-size: 12px; text-align: center; margin-top: 30px; }
  /* QR contact card */
  .qrfab { position: fixed; right: 16px; bottom: 16px; z-index: 20; width: 54px; height: 54px; border-radius: 50%; border: 0; cursor: pointer;
    background: linear-gradient(135deg, #5b3df5, #c2255c); color: #fff; box-shadow: 0 6px 18px rgb(91 61 245 / .4); display: grid; place-items: center; }
  .qrfab:hover { transform: scale(1.05); }
  #qr { position: fixed; inset: 0; z-index: 30; display: none; place-items: center; padding: 20px;
    background: linear-gradient(135deg, #5b3df5, #c2255c); }
  #qr.show { display: grid; }
  .qrcard { background: #fff; color: #1d1c22; border-radius: 24px; padding: 22px 22px 18px; width: min(420px, 100%); text-align: center; box-shadow: 0 20px 60px rgb(0 0 0 / .3); }
  .qrcard .code svg { width: 100%; height: auto; display: block; }
  .qrcard .code .err { color: var(--danger); padding: 40px 0; }
  .qrcard h2 { margin: 12px 0 2px; font-size: 22px; }
  .qrcard .sub { color: #6b6974; font-size: 14px; }
  .qrcard .url { display: block; margin-top: 6px; font-size: 13px; color: #5b3df5; word-break: break-all; text-decoration: none; }
  .qrcard .acts { display: flex; gap: 8px; justify-content: center; margin-top: 14px; }
  .qrcard .acts button { border: 1px solid #e3e1e8; background: #fff; color: #1d1c22; border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  .qrcard form { display: none; flex-direction: column; gap: 8px; margin-top: 14px; text-align: left; }
  .qrcard.editing form { display: flex; }
  .qrcard.editing .acts { display: none; }
  .qrcard label { font-size: 12px; color: #6b6974; }
  .qrcard form input { width: 100%; padding: 8px 10px; border: 1px solid #e3e1e8; border-radius: 10px; background: #f6f5f8; color: #1d1c22; margin-top: 3px; }
  .qrcard form .acts { display: flex; }
  @media (max-width: 560px) { .slot { grid-template-columns: 1fr; gap: 2px; } .slot > .t { padding-top: 0; } .gap { margin-left: 0; } }
  @media print {
    .themebtn, .hasnote, #upnext, #nm, header .row:not(.printkeep), .star, .btn, .addform, .foot, textarea, .qrfab, #qr { display: none !important; }
    header { position: static; }
    body { background: #fff; color: #000; }
    .card { break-inside: avoid; box-shadow: none !important; }
    .note { display: block !important; }
  }
</style>

<script>//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var c, mc, r, mr, qrSvg='', rect;

        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';

<script>
const DATA = {"fetchedAt":"2026-09-28T20:25:00.627Z","sessions":[{"id":"76128115-fc8e-4c96-aff3-71448bd058e1","date":"September 30, 2026","start":"9:05 AM PT","end":"9:25 AM PT","title":"Beyond the Breakthrough: What Comes Next for AI","track":"Keynote","room":"Theater 1","description":"AI is moving from breakthrough to breakthrough — but where is it actually taking us? Peter Norvig looks beyond today's models and benchmarks to explore what the next era of AI could bring, which assumptions may need to change, and the questions that will matter most as intelligent systems become more capable and widespread.","speakers":[{"name":"Peter Norvig","role":"Distinguished Education Fellow","organization":"Stanford HAI"}]},{"id":"df2c1599-c52d-457c-ac73-4e8c2eb0a090","date":"September 30, 2026","start":"9:25 AM PT","end":"9:40 AM PT","title":"Beyond the Frontier: The economics of the multi-model era","track":"Keynote","room":"Theater 1","description":"For the last few years, the AI conversation has been dominated by a handful of frontier, closed-weight models but that era is ending. As open-source models have become better and better and new specialized model labs have emerged, the industry is shifting toward a multi-model future. This future is one where open source and closed-weight models are distributed, evaluated, and run side by side on shared infrastructure, and where the right model is chosen on quality and performance for a specific job rather than the lab who created it.\n\nBaseten sits at the center of this shift, serving as a hub for distributing both open source and closed-weight models at production scale. In this talk, Philip Kiely, author of Inference Engineering and early employee at Baseten, will make the case for why this shift is not just inevitable but good for the industry. The unit economics of open source models now dramatically outperform frontier models for equivalent tasks, and smaller, fine-tuned models frequently outperform large general-purpose models on quality, latency, and cost for real customer workloads. \n\nDrawing on data from production deployments, this talk will show why the future of AI isn't one model for all tasks. It's the right model, for the right job, at the right price.","speakers":[{"name":"Philip Kiely","role":"Head of Developer Relations","organization":"Baseten"}]},{"id":"2d25f19d-b330-4d50-8467-9791663f35ee","date":"September 30, 2026","start":"9:40 AM PT","end":"9:55 AM PT","title":"Language Models, Inside Out: Finding the world models hidden in the weights","track":"Keynote","room":"Theater 1","description":"Language models are superhuman text predictors. The best way to predict a piece of text is to build a rich model of the world that generated it. Look inside a language model and that's what you find: concepts shared across languages and modalities, plans formed well in advance of being enacted, and even evolved algorithms for arithmetic. Prediction, done well enough, becomes simulation. To guess the next word, the model learns to represent the hidden variables behind the text: a speaker's emotions, beliefs, and goals. \n\n\nThe field of interpretability has spent the last few years decoding language model weights directly. This talk is a tour of some of the most important findings from this work, and of the mental model they add up to: a language model as a world model, hiding in plain sight in the weights.","speakers":[{"name":"Emmanuel Ameisen","role":"Interpretability Researcher","organization":"Anthropic"}]},{"id":"00b6bc10-62bb-4569-9c3b-cdaa13be0574","date":"September 30, 2026","start":"9:55 AM PT","end":"10:05 AM PT","title":"Agentic Commerce - A new paradigm for financial, legal, and end-user interaction","track":"Keynote","room":"Theater 1","description":"Existing payment rails, and all that is built around it, from customer identity verification, to terms of service, to the tools you use to manage and facilitate payments were built with the human user experience in mind. As companies and industries explore the use of AI in commerce, trading, and financial markets, they realize that the traditional systems used to carry out these transactions cannot be easily adapted for use by AI Agents. Companies from Stripe to Coinbase to Cloudflare are recognizing the new capabilities and technologies needed to enable agentic commerce and are building toward that future.\n\nThe way that you provide and control funds accessible to an agent, as well as how commercial flows like shopping and checkout are executed will need to be redesigned, as adapting human-centric rails doesn’t work in an AI-driven environment. Provisioning a virtual credit card for an agent doesn’t mean that agent will be able to use those funds in most commercial flows. This keynote will explore some of the gaps that exist in using traditional systems with AI, and propose some of the new solutions that can be adopted.\n\nEnterprises will understandably need more control compared to a hobby builder to enable secure agentic workflows with commercial transactions, and this keynote will discuss what the future looks like for different parties. With a summary of what is being built and what standards are being developed, this talk will give a high level view of what a commerce-enabled agentic future looks like. Distributed Ledger Technologies (DLTs) are especially well suited to play a role in Agentic Commerce, providing the infrastructure for payments, solidifying and recording human intent, legal agreements, and audit trails for agentic actions.","speakers":[{"name":"Lindsay Walker","role":"Product Manager","organization":"Hedera AI Studio"}]},{"id":"9efe84d0-54f3-45e0-967b-f7cf87fd18f7","date":"September 30, 2026","start":"10:05 AM PT","end":"10:20 AM PT","title":"Opening the AI Compute Stack with MAX and Mojo","track":"Keynote","room":"Theater 1","description":"AI hardware is exploding, but developers are still locked to a single programming model. Chris Lattner, creator of LLVM, Clang and Swift, co-founder and CEO of Modular, \nand EVP of Advanced AI Software & Platforms at Qualcomm, argues the future of compute will be decided at the software layer, not the silicon. He introduces Mojo 1.0, now fully open source under Apache 2.0, and MAX, \nan inference platform built to deliver portability and performance across increasingly diverse hardware without vendor lock-in or rewrites.","speakers":[{"name":"Chris Lattner","role":"Co-founder and CEO","organization":"Modular"}]},{"id":"b6b87572-21fd-4750-b423-d0f7512d6a10","date":"September 30, 2026","start":"10:20 AM PT","end":"10:30 AM PT","title":"GraphRAG: The Definitive Guide - A Field Guide to Patterns, Trade-offs, and Production Systems","track":"Keynote","room":"Theater 1","description":"GraphRAG has quickly become a catch-all term for everything from graph-enhanced retrieval to Text2Cypher, agent memory, and community-based summarization. That is exciting, but it also creates confusion. When people say “use GraphRAG,” what do they actually mean, and which pattern fits which problem?\n\nThis talk gives AI engineers a practical map of the GraphRAG landscape. We start with the limits of vector-only RAG, especially when data is connected, multi-hop, dynamic, or needs to be explainable. From there, we break GraphRAG into a set of core building blocks: constructing knowledge graphs from structured and unstructured data, choosing among lexical, domain, and meta graphs, and applying retrieval patterns such as guided traversal, graph-filtered search, Cypher templates, Text2Cypher, graph embeddings, query-focused summarization, and agentic retrieval.\n\nThe goal is not to present GraphRAG as one recipe, but as a toolbox with clear trade-offs. We will show when a lightweight pattern is enough, when a richer graph model pays off, and how to think about evaluation, governance, and production readiness from the start. Attendees will leave with a working mental model of GraphRAG, a taxonomy of the most useful patterns, and a decision framework for designing graph-powered GenAI systems that are accurate, explainable, and useful beyond the demo.","speakers":[{"name":"Stephen Chin","role":"VP, Developer Relations","organization":"Neo4j"}]},{"id":"4ef5ea56-5ed3-4c05-b5cf-cad2de7ee79b","date":"September 30, 2026","start":"10:30 AM PT","end":"10:50 AM PT","title":"Building AI Companies That Matter","track":"Keynote","room":"Theater 1","description":"AI is reshaping how companies are started, scaled, governed, and sustained.\nTim O’Reilly and Eric Ries bring decades of perspective on technology cycles, founder responsibility, and the systems that determine which companies endure. O’Reilly has helped shape some of the defining ideas of modern technology, from open source and Web 2.0 to mechanism design for the human-AI economy. Their conversation will cover Eric’s experience advising Anthropic, the ideas behind Incorruptible, and what it takes to build AI companies that matter.","speakers":[{"name":"Eric Ries","role":"Founder and Author of The Lean Startup and Incorruptible","organization":"LTSE Service"},{"name":"Tim O’Reilly","role":"Founder and CEO","organization":"O’Reilly Media"}]},{"id":"97efa4e5-e98d-4a54-b0dc-db1b584dc6c4","date":"September 30, 2026","start":"11:30 AM PT","end":"11:55 AM PT","title":"Harness Engineering: How to Build Software When Humans Steer and Agents Execute","track":"AI Builders","room":"Theater 2","description":"Reasoning models and coding agents have changed what is possible in software development, but most teams are still using workflows designed for a world where humans write nearly all of the code directly. That mismatch is where much of the confusion around AI coding comes from. The strongest results do not come from simply giving a model access to a repository and asking it to start building. They come from designing the surrounding system that makes agent output useful, repeatable, and trustworthy.\n\nThis talk introduces Harness Engineering: an agent-first approach to software development where the key engineering task increasingly shifts from manually producing every implementation detail to building the harnesses that let agents do meaningful work safely and at high quality. In practice, that means defining goals clearly, shaping context, constraining tool access, establishing verification and evaluation loops, and building feedback systems that keep agents productive without making them reckless.\n\nI’ll share a practical framework for how to make coding agents actually work in real software environments. We’ll cover how to scope tasks so they are tractable for agents, how to think about context windows and state, how to design acceptance checks and guardrails, and how to identify the kinds of work agents can already do well versus the situations where they still fail badly. I’ll also discuss why raw model capability is not the same thing as deployable engineering output, and why most production success comes from the harness around the model rather than the model alone.\n\nAttendees will leave with concrete patterns, failure modes, and mental models for building software when humans increasingly steer and agents increasingly execute.","speakers":[{"name":"Ryan Lopopolo","role":"Principal Engineer","organization":"Agentic Google Cloud Platform"}]},{"id":"ffada946-8457-4ca4-96ec-928e5f7e6617","date":"September 30, 2026","start":"11:30 AM PT","end":"11:55 AM PT","title":"Monitoring Frontier Models for Frontier Risks","track":"AI Frontiers","room":"Theater 1","description":"An OpenAI model breaking containment and attacking Hugging Face this summer proved that far-off frontier AI risks are now everyday AI risks. The industry is months away from an open model capable of the same damage, or worse, in higher-stakes emerging fields like biology. We need to prepare for these emerging risks by building guardrails that catch reward hacking, offensive cyberattacks, and biorisk in production, because these and other risks still slip past today's standard monitoring approaches. In this talk, Dan Balsam will present an approach to frontier risk guardrails that \"reads the mind of the model,\" using a model's internal representations to catch reward hacking and other harmful behavior as it happens. He'll share case studies from production guardrails across risk categories like cyber and biology, discuss benefits for cost and performance, and what defenders can build into their models now to protect against frontier risks.\nBio: Dan Balsam is co-founder and CTO of Goodfire, an AI research lab using interpretability to understand, learn from and design AI systems.","speakers":[{"name":"Dan Balsam","role":"Co-founder and CTO","organization":"Goodfire"}]},{"id":"c204498e-0471-49a4-88cc-10fb06ad4293","date":"September 30, 2026","start":"11:30 AM PT","end":"11:55 AM PT","title":"Evaluating Agentic AI in the Real World: A Framework for AI Evaluation Through the Use Case of a Retail Shopping Assistant","track":"AI Strategy","room":"Theater 5","description":"Most teams treat evaluation as a checkpoint before launch. This talk argues it belongs earlier: baked into the development loop from the first prototype, not bolted on after the fact. It lays out an evaluation lifecycle for agentic AI systems, covering how eval requirements get gathered across stakeholders, how metrics get designed and validated, and how evals get embedded into CI/CD as a continuous gate rather than a one-time audit.\nThe framework is substantiated with SERA, a taxonomy of 21 LLM-as-a-Judge metrics spanning Safety, Compliance, and Agent Quality for retail agentic shopping assistants, accepted at RecSys 2026. The talk traces the evaluation lifecycle from metric design and risk-proportional aggregation to a persona-driven simulator for multi-turn stress testing, and ultimately to deploying the evaluation suite as a CI/CD gate for an agent under development. It highlights real regressions caught in practice including relaxed dietary filters, over-refusal, and degraded recommendation relevance while also examining the framework’s limitations and the challenges that remain in evaluating production-grade agentic systems.","speakers":[{"name":"Sowmya Podila","role":"Senior Applied AI Scientist","organization":"Target"}]},{"id":"9088404d-9d9f-4a6a-97de-5f3e80a688e4","date":"September 30, 2026","start":"11:30 AM PT","end":"11:55 AM PT","title":"Beyond Toil: Building a Scalable AI-Powered Change Management Platform","track":"Applied AI","room":"Theater 4","description":"This talk will share practical insights and design patterns for developing a scalable and efficient AI agent platform for generalized change management, applicable to Org Policy, IAM, code reviews, and beyond.\n\nThe session will cover:\n\n- The \"Synapse as a Service\" Vision: Designing a multi-client platform where various teams can onboard their own review workflows.\n\n- Dynamic Workflow Orchestration: Architecting a system that can intelligently route requests and dynamically load team-specific playbooks and logic.\n\n- Intelligent Dispatching: Utilizing LLMs to understand and categorize incoming change requests from various sources (Bugs, Code changes, API calls).\n\n- Playbook-Driven Evaluation: How natural language playbooks, maintained by client teams, guide the AI's review process, allowing domain experts to define logic without deep coding.\n\n- Modular Action Execution: Designing a flexible system for taking actions based on review outcomes, such as updating tickets, commenting on CLs, or triggering other agents.\n\n- RAG for Contextual Awareness: Strategies for Retrieval Augmented Generation (RAG) to provide the agent with the necessary context from internal knowledge bases and documentation.\n\n- Key Design Considerations: Challenges and learnings in building a configurable and extensible multi-agent system using ADK, including state management and tool integration.\n\n- Measuring Success: Defining metrics for evaluating platform effectiveness, including adoption, processing time, and consistency.\nFuture Roadmap: Expanding capabilities, onboarding more client teams, and deeper integrations.\n\nThis session provides a blueprint for leveraging AI to create adaptable and intelligent change management automation, drawing on our experience building the Synapse Agent Platform at Google.","speakers":[{"name":"Jack Hopkins","role":"Security Engineer","organization":"Google"},{"name":"Andrey Kovalev","role":"Senior Security Engineer","organization":"Google"}]},{"id":"41fb604e-2f06-4e8b-bc1e-98c85f676158","date":"September 30, 2026","start":"11:30 AM PT","end":"11:55 AM PT","title":"Stop Renting Intelligence: The Train-to-Deploy Loop for Specialized AI","track":"The AI Stack","room":"Theater 3","description":"The next wave of AI products will not rely only on prompting generic frontier models. Winning teams will own specialized models shaped by their product data, user feedback, and domain workflows.\nIn this 25-minute session, we’ll cover the practical loop behind model ownership: choose a base model, prepare data, fine-tune with SFT/DPO/RL, evaluate outputs, deploy the tuned model, collect feedback, and repeat. We’ll also explain why training and inference should be treated as one system, not separate steps.\nAttendees will leave with a simple framework for when to tune, when RL matters, and how continuous improvement turns fine-tuning from a one-off project into a product advantage.","speakers":[{"name":"Jetashree Ravi","role":"Technical Lead Manager","organization":"Fireworks"}]},{"id":"2689b50e-c77c-455f-8945-be3e4485a0f0","date":"September 30, 2026","start":"12:00 PM PT","end":"12:25 PM PT","title":"Your Agent Needs a Steering Wheel","track":"AI Builders","room":"Theater 2","description":"What if your AI agent could recognize a bad move before making it and adjust its next step? Most agents rely on prompts for instructions and guardrails to catch failures. That leaves a gap during execution, when an agent skips a required check, repeats a broken tool call, or reaches a decision that needs human judgment.\n\nThis session introduces steering, for just-in-time guidance inside the agent loop. Through a live demo using an open-source agent harness framework, attendees will learn how to inspect the proposed actions, guide recovery, enforce required steps, and add approval points without giving up the flexibility that makes agents useful.","speakers":[{"name":"Sandhya Subramani","role":"Senior Gen AI Developer Advocate","organization":"Amazon Web Services"}]},{"id":"1d13b8ab-20e9-4e7d-8a66-1684f5655fea","date":"September 30, 2026","start":"12:00 PM PT","end":"12:25 PM PT","title":"Enterprise AI Engineering: From Modernization to Autonomous Software Delivery","track":"AI Frontiers","room":"Theater 1","description":"Agentic software engineering is expanding beyond coding assistance toward autonomous execution across the software lifecycle. As this shift takes hold, AI agents are beginning to take on broader, longer-running work, while humans increasingly define goals, constraints, and desired outcomes rather than individual tasks.\n\nApplication modernization illustrates this shift in practice: agents help understand complex systems, transform applications, and optimize how software is built and maintained. As agents take on this kind of work, enterprise realities come into play — hybrid and on-prem environments, governance, security, and operational control all shape how these systems can operate responsibly at scale.\n\nAs agents operate within these enterprise constraints, their workloads grow, and economics and model strategy become part of the architecture. This session explores how model selection and rotation can optimize for capability, speed, and cost, and what these trends suggest about the future of increasingly autonomous software delivery.","speakers":[{"name":"Anthony Stevens","role":"Principal AI Architect","organization":"IBM"}]},{"id":"20e3ba9e-d09c-4497-8842-22c9a3e96822","date":"September 30, 2026","start":"12:00 PM PT","end":"12:25 PM PT","title":"Controlling AI with AI: How to Secure Agentic AI at Scale","track":"AI Strategy","room":"Theater 5","description":"AI agents operate at 100x human speed, completely outpacing traditional frameworks for enterprise oversight and control. This unprecedented speed brings unpredictable risk. Whether an agent accidentally goes rogue or is deliberately hijacked by a threat actor, the fallout is instantaneous.\"\n\nIn this session we'll confront a hard truth of the agentic enterprise: static, rules-based security and \"human-in-the-loop\" safeguards are dead. They simply cannot scale against unpredictable, non-deterministic systems. To unleash agents without the risk, you need a fundamentally new architecture where AI governs AI. Join us for a deep dive into this new approach and see exactly how it operates in the wild.\n\nWhat you'll learn:\n• Why legacy security fails against autonomous agents and what to do about it\n• Why you need small language models to enforce semantic policies, instantly decoding intent where rigid machine rules break down\n• Real world Use Case: How we secured Claude, proactively catching issues like data exposure and credential harvesting\n• Live Tool Blocking Demo: Instantly identify and neutralize an unauthorized autonomous action before it happens","speakers":[{"name":"Dev Rishi","role":"GM of AI","organization":"Rubrik"}]},{"id":"26330298-4ea7-41f7-9e6e-c66274b5e26f","date":"September 30, 2026","start":"12:00 PM PT","end":"12:25 PM PT","title":"Building an AI Assistant for Gig Workers: Multi-Agent Architecture and Measurable Economic Impact at Uber","track":"Applied AI","room":"Theater 4","description":"Uber's Assistant is a production AI system that helps rideshare drivers on Uber understand their earnings, navigate demand patterns, and make better real-time decisions. It has been launched to Drivers across the US. This talk covers how we built a multi-agent architecture that makes it easy for product teams without deep AI expertise to ship production quality AI applications, without each individual team having to worry about orchestration, guardrails, or infrastructure. We’ll also cover what we learned deploying the system at scale where accuracy and trust are non-negotiable because wrong answers directly affect workers' livelihoods.\n\nThe problem: Drivers and Couriers need to understand complex earnings breakdowns, want to find high-demand opportunities, and frequently contact support for answers that live across fragmented systems. Traditional FAQ-style solutions failed because driver and courier questions are highly contextual, tied to specific trips, locations, and time windows.\n\nWhat we built: A multi-agent system powered by Uber's LangFx framework where domain-specific capabilities like trip breakdowns, surge zones, airport activity, and demand forecasting are encapsulated as modular agents with built-in RAG pipelines over internal earnings documentation. The architecture abstracts away orchestration, memory management, and content safety so that product teams can compose new capabilities by defining tools and prompts rather than building AI infrastructure from scratch. Multiple layers of guardrails ensure the system stays on-topic and accurate, catching problematic queries early and validating responses before they reach the driver, which is critical when inaccurate information can erode the trust of the people who depend on your platform for their income. We leverage agentic loops that combine offline evaluation, and online feedback to iteratively improve prompt strategies, and tool selection without manual retuning. This helps us turn production traffic at scale into a continuous quality improvement signal. \n\nWhat we measured: A controlled experiment showed statistically significant increases in earnings per hour and supply utilization by smarter repositioning. Helpfulness scores measured by a prototyped evaluation process improved as we scaled from beta to full US rollout, and qualitative research showed strong recommendation intent among drivers.\n\nWhat attendees will learn:\nHow a multi-agent architecture lowers the barrier for product teams to build and ship AI applications without deep ML expertise\nDesigning AI for high-trust contexts where quality & consistency is critical and wrong answers have real consequences                                                       \nWhy zero-state prompt design is critical and what that means for conversational AI entry points\nHow category-level helpfulness analysis reshaped our roadmap and prioritization                                                                            \nProduction safety patterns: when to filter before the LLM, when to let the model self-police, and when you need runtime guardrails","speakers":[{"name":"Dharmin Parikh","role":"Director of Product","organization":"Uber"},{"name":"Himaanshu Gupta","role":"Director of Engineering","organization":"Uber"}]},{"id":"00466c50-2883-4e7d-b886-4597e0911509","date":"September 30, 2026","start":"12:00 PM PT","end":"12:25 PM PT","title":"Data Quality is The Compute Multiplier","track":"The AI Stack","room":"Theater 3","description":"Better data quality is the highest-leverage and most underinvested part of building a model: it produces a better model for the same compute, whether you're mid-training on an open base or pre-training from scratch. This session is a practical look at data curation, covering what data quality actually means, the stages of a modern curation pipeline (cleaning, filtering, deduplication, synthetic data generation, algorithmic mixing, and multi-stage composition), and which steps matter most in practice. It draws on DatologyAI's frontier data research and customer results, including Thomson Reuters' mid-training gains on proprietary legal domain data and Arcee's Trinity model reaching the open frontier on public data alone. You'll leave with a concrete sense of where better data quality pays off and how data curation is shaping the future of model training.","speakers":[{"name":"Ari Morcos","role":"Co-Founder and CEO","organization":"DatologyAI"}]},{"id":"f34261b3-50e0-4aaf-8145-4ea9f8df3fdf","date":"September 30, 2026","start":"12:30 PM PT","end":"12:55 PM PT","title":"Observe, Enforce, and Govern: The Fiddler Control Plane and Centor Models","track":"AI Builders","room":"Theater 2","description":"An agent in your pipeline just wrote code, called an API, or touched a database, and nobody reviewed it first. That's the autonomy agents already have. The question is whether you'd know if one did something wrong, and how long it would take you to find out.\nThat’s what the AI Control Plane is for: a system of trust that starts with evaluation, since that's what makes it possible to monitor an agent's activity, enforce policy on an agent's actions before they execute, and govern behavior across the agentic lifecycle.\nWe'll show what this looks like in practice: inline guardrails that check an agent's actions before they execute, and dashboards that break down exactly what every agent is doing and spending by developer, team, and token. We'll also show how Fiddler Centor Models come batteries-included, no external API calls, no added cost per evaluation, so you can evaluate 100% of your traces or scale down to sampling for smaller deployments. The same approach works whether you're operating a handful of agents or a fleet.\nYou'll leave with a practical way to decide which of your agents have earned more autonomy, and how to give it to them without losing the ability to govern what they're doing.","speakers":[{"name":"Joshua Rubin","role":"Principal AI Scientist","organization":"Fiddler AI"}]},{"id":"5638c218-66ea-4a0c-8faf-ab4b394492a3","date":"September 30, 2026","start":"12:30 PM PT","end":"12:55 PM PT","title":"The Instruction Layer: Turning Enterprise Knowledge Into Trusted AI Answers and Actions","track":"Lunch Breakout Session","room":"Theater 4","description":"Every AI-powered interaction now speaks for the company that deployed it. Users do not distinguish between an answer from a person and an answer from an agent, and neither do regulators. Yet most teams have pointed capable models at operational knowledge that is fragmented, out of date, and ungoverned, then been surprised when benchmark scores hold up and production does not.\n\nInconsistent policies, duplicate content, conflicting sources of truth, and expertise that lives only in people’s heads produce the same outcomes every time: wrong answers, failed automation, compliance exposure, and a slow erosion of user trust that is expensive to win back.\n\nThis session looks at how leading organizations are building a trusted knowledge foundation for enterprise agents, moving from traditional knowledge management to infrastructure designed to instruct AI. We will cover what changes in governance, how to evaluate answer quality continuously rather than by sample, and what it takes to deliver instant, trusted answers across every channel an agent touches.","speakers":[{"name":"James Hunt","role":"Marketing Associate","organization":"eGain"}]},{"id":"d6b84894-f35f-4f5a-9c81-7b79079e813d","date":"September 30, 2026","start":"12:30 PM PT","end":"12:55 PM PT","title":"Your agents lack context: Here's how to fix \"You're absolutely right!\"","track":"Lunch Breakout Session","room":"Theater 5","description":"Agents can generate code. Very few can generate the right code for your organization, because they’re missing context. They don’t know why your team chose Redis over DynamoDB, what the team decided in a Slack thread from two months ago about the auth migration, or which architectural patterns your principal engineers actually enforce in review.\n\nThis talk is a practitioner’s guide to building a context engine: the reasoning layer that continuously synthesizes organizational knowledge across disparate sources into unified, queryable understanding. I’ll walk through the problems you actually have to solve — reasoning across systems that don’t agree with each other, searching globally before you can reason, maintaining identity-scoped permissions so every user and agent only sees what they should, and personalizing results based on who’s asking and what they’re working on. These are the engineering challenges that make naive RAG fall short, drawn from real lessons building this at scale.","speakers":[{"name":"Brandon Waselnuk","role":"Developer Relations","organization":"Unblocked"}]},{"id":"d0a4b744-3aff-406b-8611-974dda0dd356","date":"September 30, 2026","start":"12:30 PM PT","end":"12:40 PM PT","title":"How to build an AI-native company: What Shopify, Instacart, Ramp, and Gusto do differently","track":"Lunch Mainstage Talk","room":"Theater 1","description":"After two years working with companies like Shopify, Instacart, Ramp, and Gusto, Max Brodeur-Urbas, CEO of Gumloop, has found that the hardest part of making AI work has almost nothing to do with the latest frontier lab model. It has to do with how the company is wired. \n\nNearly every company is in a sprint to avoid falling behind on the AI curve, rapidly rolling out agents and automations without considering who is best equipped to build them, how they will be governed, or what they will cost long term.\n\nThe organizations pulling ahead let the people closest to the work build and share automations across their team, they give IT the controls to govern AI usage, and they prioritize sustainable spending habits by routing work to cheaper open-weight models.\n\nMax will walk through what this looks like inside companies already running this way, and leave leaders with a clearer picture of how to roll out AI, measure success, and see real business impact.","speakers":[{"name":"Max Brodeur-Urbas","role":"CEO","organization":"Gumloop"}]},{"id":"65526dcf-1c2b-4c72-bf36-d522da8409c8","date":"September 30, 2026","start":"12:30 PM PT","end":"12:40 PM PT","title":"Fast Track to Production: The New Stack for Today's Founders","track":"The AI Stack","room":"Theater 3","description":"Watch a complete software delivery pipeline go from zero to running in minutes, then spend the rest of the session on the more interesting question: what do you do with all the time you just got back?\nCircleCI's Nick Smith will demo the new CircleCI CLI live, and and lead a discussion on how tools with robust terminal-based access reduce the burden of setup so you can get to building software. Whether you're a technical founder, a domain expert eyeing your first product, or an executive wondering why your team still struggles with deployments, this session shows how much simpler getting code into production can be today, and opens the floor to what that possibility actually unlocks.","speakers":[{"name":"Nick Smith","role":"Staff Field Engineer","organization":"CircleCI"}]},{"id":"9f869b22-26d6-4ed1-bb2a-6fc60062b382","date":"September 30, 2026","start":"12:45 PM PT","end":"12:55 PM PT","title":"Introducing Redpanda's Agentic Data Plane","track":"Lunch Lightning Talk","room":"Theater 3","description":"AI agents are increasingly deployed as digital employees—accessing enterprise data, making decisions, and acting autonomously. But agents are both less predictable than humans (prone to hallucination, misinterpretation, and adversarial manipulation) and more capable, with deep system access and machine-speed execution that can cascade damage fast. This makes it unsafe to trust agents to faithfully interpret or propagate security-critical metadata like access policies, data classifications, and behavioral constraints.\n\nWe present Redpanda's Agentic Data Plane (ADP): an architecture using out-of-band metadata channels that carry security context, policy signals, and audit trails deterministically—entirely outside the agent's read/write path, across heterogeneous infrastructure. These channels enforce governance at every stage of the agent lifecycle: scoping data access going in, constraining actions during execution, and capturing tamper-proof audit trails coming out.","speakers":[{"name":"Piyush Agarwal","role":"VP, Engineering","organization":"Redpanda"}]},{"id":"2ef78b0d-ffe4-4e26-a2b8-f4149c13c7db","date":"September 30, 2026","start":"12:45 PM PT","end":"12:55 PM PT","title":"Move Fast and Don’t Break Things: A New Model for AI Governance","track":"Lunch Mainstage Talk","room":"Theater 1","description":"Every enterprise wants to move faster with AI, but most governance programs slow that down because they were built for humans, not machines. AI agents act in milliseconds, often with more access than any single task requires, and most governance programs lose sight of what they’re doing once they’re running.\n\nCompanies often feel forced into a false choice: lock AI down and slow the business or move fast and lose control. The companies pulling ahead rejected that trade-off entirely. They rebuilt their controls to match the speed of AI, getting more agents into production faster, with a complete record of every action to back it up.\nThis session shows how, and what becomes possible when authorization stops being a policy you set once and starts keeping pace with every decision your AI makes.","speakers":[{"name":"Art Gilliland","role":"CEO","organization":"Delinea"}]},{"id":"b2df04bd-53a7-4fd8-a16b-14aa6483085a","date":"September 30, 2026","start":"1:00 PM PT","end":"1:25 PM PT","title":"Controlling the AI Software Factory: Keeping Engineers in Charge at Agent Speed","track":"Lunch Breakout Session","room":"Theater 2","description":"AI is not just changing how fast software is written. It is changing how software is produced. \nEngineering organizations are assembling agent-powered systems that write code, review pull requests, validate releases, deploy changes, and continuously improve production software around the clock, without human hands on every step. The promise of faster software delivery and continuous optimization is real. But as delivery becomes more autonomous, a new and more urgent problem surfaces: how do you stay in control of systems that never stop evolving?\nIn this session, Jonathan Nolen, Chief Product Officer at LaunchDarkly, makes the case that the defining challenge of the AI era is not generating code — it is controlling autonomous systems in production. Traditional pre-production controls and the standard playbook of detect, fix, redeploy break down for agents that don't fail like traditional software. They drift. You can no longer catch issues before production. You have to control production.\nJonathan will share what LaunchDarkly has learned building its own AI software factory — including what happened when coding agents met its oldest, most complex production code — and why every autonomous delivery system requires a closed control loop: observation, decision-making, intervention, and feedback, all running at runtime without a deploy cycle.\nAttendees will leave with a practical framework for building AI software factories that are genuinely fast and safe, and a clear answer to the question every engineering leader is now facing: when agents are doing the work, who stays in charge?","speakers":[{"name":"Jonathan Nolen","role":"Chief Product Officer","organization":"LaunchDarkly"},{"name":"Timothy Cook","role":"Director of Product Management","organization":"LaunchDarkly"}]},{"id":"0d7479b6-42bf-4451-bfa4-b47ea1d7d706","date":"September 30, 2026","start":"1:00 PM PT","end":"1:25 PM PT","title":"Mission control - Giving AI agency (without losing control)","track":"Lunch Breakout Session","room":"Theater 5","description":"The AI conversation has become uncomfortably binary: either hand everything to AI and hope for the best, or resist automation entirely and fall behind. But organizations achieving real results are doing something different: building Mission Control architectures where AI has genuine agency while humans maintain strategic oversight. Inspired by NASA’s model of autonomous systems backed by human judgment, this session will show you how to determine when AI should act independently, when it should assist, and when people must remain in control. You’ll leave with a practical framework for scaling AI across service operations without sacrificing visibility, trust, or control.","speakers":[{"name":"Payal Patel","role":"Senior Director, Solution Engineering","organization":"Freshworks"}]},{"id":"a510a43c-3f04-4925-9042-360578952866","date":"September 30, 2026","start":"1:00 PM PT","end":"1:25 PM PT","title":"When AI Adoption Works: The Infrastructure and People Problems That Come Next","track":"Lunch Breakout Session","room":"Theater 4","description":"In this talk, Coder Product Manager David Fraley explores what happens after enterprise AI adoption gains traction and why success creates a harder set of problems than the ones platform teams started with.\n\nFew organizations plan for what breaks once early barriers are cleared: code generation outpacing CI/CD, team structures misaligned with agent workflows, and senior engineers shifting from writing code to directing agents.\n\nDrawing on patterns across enterprises at every stage of AI maturity, this session maps predictable failure modes at scale and the infrastructure decisions that support or stall the transition.\n\nKey takeaways:\n* Why CI/CD becomes the bottleneck after AI rollout\n* How team structure must evolve as agents scale\n* What sustaining AI adoption looks like in practice","speakers":[{"name":"David Fraley","role":"Product Manager","organization":"Coder"}]},{"id":"1559e564-267e-4ac7-b21e-f435ccaa0088","date":"September 30, 2026","start":"1:00 PM PT","end":"1:10 PM PT","title":"Monitoring in the Age of GenAI: Beyond Golden Signals","track":"Lunch Lightning Talk","room":"Theater 3","description":"The four golden signals (Latency, Errors, Traffic, Saturation) have been the foundation of application monitoring for years, and it still matters, but for GenAI applications, these signals alone leave significant blind spots. A request can return 200 OK with low latency while the response hallucinates, leaks PII, or costs much more than expected.\n\nThis talk will walk you through what changes when you're monitoring non-deterministic, token-priced, prompt-injectable systems. We'll cover three additional monitoring dimensions — Cost (token attribution, model-mix tracking, wasted spend on failed requests), Safety (prompt injection detection, PII scanning, jailbreak attempts), and Quality (hallucination rate, relevance scoring, user satisfaction) — and show why each one is necessary alongside your existing instrumentation.","speakers":[{"name":"Lars Kamp","role":"Senior Staff Technical Advocate","organization":"Datadog"}]},{"id":"101873b2-22e9-424e-8155-187de976228d","date":"September 30, 2026","start":"1:00 PM PT","end":"1:10 PM PT","title":"Secure Orchestration Layer for Agentic Enterprise","track":"Lunch Mainstage Talk","room":"Theater 1","description":"As AI models and agents move into production, inference optimization and security are becoming critical infrastructure challenges for enterprises.\n\nThis talk will explore how inference can be optimized at the token level to improve latency, and cost efficiency, particularly as agentic workloads become more demanding.\n\nIt will also address secure inference architectures and the technical requirements for protecting sensitive data throughout execution, while maintaining the performance required for production workloads.\n\nAttendees will gain a practical understanding of how token-level optimization and secure inference can work together to run AI efficiently and securely at enterprise scale.","speakers":[{"name":"Richard Rizk","role":"CTO","organization":"Blackbox AI"}]},{"id":"ee186dc8-b4c4-4e5b-b67d-4f2fba430e5d","date":"September 3
